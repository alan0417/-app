<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>發薪日預算</title>
<style>
  :root{
    --bg:#f5f2ec; --card:#fffdf9; --ink:#1f2a24; --muted:#6f776f; --line:#e4dfd5;
    --accent:#2f6b4f; --accent-soft:#e3efe7; --warn:#c0492f; --warn-soft:#f8e4de; --carry:#8a6a2c; --carry-soft:#f3ead6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    -webkit-tap-highlight-color:transparent}
  #app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:140px;position:relative}
  header{padding:16px 8px 8px;position:sticky;top:0;background:var(--bg);z-index:5}
  .cycle-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .cycle-nav button{border:0;background:transparent;font-size:26px;color:var(--muted);width:30px;flex:none;height:40px;border-radius:20px;cursor:pointer}
  .cycle-nav button:disabled{opacity:.2;cursor:default}
  .cycle-mid{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
  .date-badge{background:#244c9c;color:#fff;border-radius:12px;padding:6px 12px;font-size:clamp(24px,7.5vw,30px);font-weight:500;line-height:1.1;flex:none;letter-spacing:.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .cycle-title{text-align:left;min-width:0}
  .cycle-title .t{font-weight:800;font-size:19px}
  .cycle-title .s span{white-space:nowrap}
  .cycle-title .s{font-size:clamp(11.5px,3.3vw,13px);color:var(--muted);margin-top:3px;line-height:1.4}
  main{padding:4px 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
  .bcard{cursor:pointer}
  .card.income{border-color:#cfe0d5;background:linear-gradient(180deg,#f3f9f5,#fffdf9)}
  .bhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .bname{font-weight:700;font-size:16px}
  .tag{font-size:11px;padding:2px 7px;border-radius:9px;background:var(--carry-soft);color:var(--carry);margin-left:6px;font-weight:600;vertical-align:2px}
  .bremain{font-size:13px;color:var(--muted);text-align:right}
  .bremain b{color:var(--ink);font-size:15px}
  .bar{height:8px;background:#ece7dd;border-radius:4px;margin:10px 0 8px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
  .bar.over>i{background:var(--warn)}
  .bar.carry>i{background:var(--carry)}
  .daily{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
  .daily .v{font-size:20px;font-weight:700;color:var(--accent)}
  .daily .v.neg{color:var(--warn)}
  .elist{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}
  .erow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:14px;gap:8px}
  .erow+.erow{border-top:1px solid #f0ece4}
  .erow .l{min-width:0}
  .erow .d{font-size:12px;color:var(--muted)}
  .erow .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .erow .r{text-align:right;white-space:nowrap}
  .pct{font-size:12px;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:8px;margin-left:6px}
  .empty{color:var(--muted);font-size:13px;padding:6px 0}
  .big{font-size:34px;font-weight:800;letter-spacing:-.5px}
  .label{font-size:13px;color:var(--muted)}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
  .grid3 div{background:var(--bg);border-radius:10px;padding:8px}
  .grid3 b{display:block;font-size:15px;margin-top:2px}
  .share{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:12px 0 8px;background:#ece7dd}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
  .legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:5px}
  .btag{font-size:11px;padding:1px 6px;border-radius:8px;background:var(--accent-soft);color:var(--accent);margin-right:6px}
  .del{border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 6px;margin-left:4px;border-radius:6px}
  .del.armed{background:var(--warn);color:#fff}
  h3{font-size:14px;color:var(--muted);margin:18px 2px 8px;font-weight:600}
  .tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
  .tabs button{flex:1;border:0;background:transparent;padding:12px 0 14px;font-size:13.5px;white-space:nowrap;color:var(--muted);cursor:pointer;font-family:inherit}
  .tabs button.on{color:var(--accent);font-weight:700}
  .tabs button[data-tab=budget]{flex:1.6}
  #fab{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);border:0;background:var(--accent);color:#fff;font-size:16px;font-weight:700;padding:14px 28px;border-radius:28px;box-shadow:0 6px 18px rgba(47,107,79,.35);cursor:pointer;z-index:11;font-family:inherit}
  #fab.hidden{display:none}
  .mask{position:fixed;inset:0;background:rgba(20,25,22,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
  .mask.hidden{display:none}
  .sheet{background:var(--card);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px 18px 28px;max-height:90vh;overflow:auto}
  .sheet h2{margin:0 0 14px;font-size:18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input,select{font-family:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
  .amount-in{font-size:28px;font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:8px 14px;font-size:14px;cursor:pointer;font-family:inherit;color:var(--ink)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip small{opacity:.75;margin-left:4px}
  .row{display:flex;gap:8px}
  .btn{border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn.primary{background:var(--accent);color:#fff;flex:1}
  .btn.ghost{background:#efebe3;color:var(--ink)}
  .btn.danger{background:var(--warn-soft);color:var(--warn)}
  .btn.danger.armed{background:var(--warn);color:#fff}
  .brow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .brow input.nm{flex:1.3}
  .brow input.am{flex:1}
  .brow .fixed{flex:1;font-size:14px;color:var(--muted);padding:10px 4px}
  .hint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:6px}
  .banner{background:var(--carry-soft);color:var(--carry);font-size:13px;border-radius:12px;padding:10px 12px;margin-bottom:12px;line-height:1.5}
  .readonly{background:#efebe3;color:var(--muted);font-size:13px;border-radius:12px;padding:10px 12px;margin-bottom:12px}
  .hrow{display:flex;justify-content:space-between;font-size:14px;padding:6px 0}
  .hrow+.hrow{border-top:1px solid #f0ece4}
  .hrow .sub{color:var(--muted);font-size:12px}
  .htotal{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700}
  .htotal .v{font-size:20px}
  .alloc{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:14px}
  .alloc.res{border-top:2px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700}
  .alloc.res .v{font-size:22px}
  .pos{color:var(--accent)} .neg{color:var(--warn)}
  #toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:#1f2a24;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
  #toast.show{opacity:1}

  /* ===== 擬物風格（neumorphism）===== */
  :root{
    --bg:#e4e5e8; --card:#e9eaed; --ink:#3c4047; --muted:#878b92; --line:#c3c6cb;
    --accent:#4c5a66; --accent-soft:#d9dde1; --warn:#c2574a; --warn-soft:#ead9d6;
    --hi:#ffffff; --lo:#c3c6cc; --rim:#b7bac0;
    --raise: 6px 6px 14px var(--lo), -6px -6px 14px var(--hi);
    --raise-sm: 3px 3px 7px var(--lo), -3px -3px 7px var(--hi);
    --press: inset 3px 3px 7px var(--lo), inset -3px -3px 7px var(--hi);
    --knob: linear-gradient(160deg,#f7f8f9 0%,#e3e4e7 55%,#d3d5d9 100%);
  }
  html,body{background:var(--bg)}
  header{background:var(--bg)}
  .card{background:var(--card);border:1px solid var(--rim);border-radius:22px;box-shadow:var(--raise)}
  .card.income{background:var(--card);border-color:var(--rim)}
  .cycle-nav button{background:var(--knob);border:1px solid var(--rim);box-shadow:var(--raise-sm);width:34px;height:34px;font-size:18px;color:var(--muted)}
  .cycle-nav button:disabled{opacity:.35}
  .date-badge{box-shadow:var(--raise-sm), inset 0 1px 0 rgba(255,255,255,.25);border:1px solid #1d3d7e}
  .bar{background:var(--bg);box-shadow:inset 2px 2px 4px var(--lo), inset -2px -2px 4px var(--hi);height:10px;border-radius:6px}
  .bar>i{background:linear-gradient(180deg,#7c8792,#56616c)}
  .bar.over>i{background:linear-gradient(180deg,#d77a6e,#b44c40)}
  .share{box-shadow:inset 2px 2px 4px var(--lo), inset -2px -2px 4px var(--hi);background:var(--bg)}
  .grid3 div{background:var(--bg);box-shadow:var(--press);border-radius:14px}
  .daily .v{color:var(--ink)}
  .pos{color:#4f7a62}
  .pct{background:var(--bg);color:var(--accent);box-shadow:var(--press)}
  .btag{background:var(--bg);color:var(--accent);box-shadow:var(--press)}
  .banner,.readonly{background:var(--bg);color:var(--muted);box-shadow:var(--press);border:1px solid var(--rim)}
  input,select{background:var(--bg);border:1px solid var(--rim);box-shadow:var(--press);border-radius:14px}
  input:disabled{color:var(--muted)}
  input:focus,select:focus{outline:none;border-color:#8d939b}
  .btn,.chip,.del{background:var(--knob);border:1px solid var(--rim);box-shadow:var(--raise-sm);color:var(--ink)}
  .btn{border-radius:999px}
  .btn.primary{background:var(--knob);color:var(--ink)}
  .btn.ghost{background:var(--knob)}
  .btn.danger{color:var(--warn)}
  .btn:active,.chip:active,.del:active,#fab:active,.cycle-nav button:active:not(:disabled){box-shadow:var(--press);background:var(--bg)}
  .chip{border-radius:999px}
  .chip.on{background:#d6d9dd;color:var(--ink);border-color:#7f868f;box-shadow:var(--press);font-weight:700}
  .chip.on::before{content:"●";font-size:9px;margin-right:6px;vertical-align:2px;color:#4c5a66}
  .del{border-radius:999px;padding:5px 10px;font-size:12px;color:var(--muted)}
  .del.armed,.btn.danger.armed{background:var(--warn);color:#fff;border-color:var(--warn)}
  .tabs{background:var(--bg);border-top:1px solid var(--rim);padding:8px 10px calc(10px + env(safe-area-inset-bottom));gap:8px;box-shadow:0 -4px 12px rgba(0,0,0,.04)}
  .tabs button{border-radius:999px;padding:10px 0;border:1px solid transparent}
  .tabs button.on{background:var(--bg);box-shadow:var(--press);border-color:var(--rim);color:var(--ink)}
  #fab{background:var(--knob);color:var(--ink);border:1px solid var(--rim);box-shadow:8px 8px 18px rgba(150,154,162,.7), -6px -6px 14px var(--hi);bottom:84px}
  .sheet{background:var(--card);border-top:1px solid var(--rim)}
  .mask{background:rgba(60,64,71,.25)}
  #toast{background:#4a5058}
  h3{color:var(--muted)}
  .erow+.erow,.hrow+.hrow{border-top-color:#d6d8dc}
  .htotal,.alloc.res{border-top-color:var(--rim)}

  /* ===== 重點金額：橙色 ===== */
  :root{ --orange:#1f5fe6; --orange-fill:linear-gradient(180deg,#3d7bf5,#1a52dc); }
  .big,.amt,.daily .v,.grid3 b,.bremain b,.htotal .v,.pos,.alloc.res .v.pos{color:var(--orange)}
  .daily .v.neg,.grid3 b.neg,.htotal .v.neg,.bremain b.neg,.neg{color:var(--warn)}
  .bar>i{background:var(--orange-fill)}
  .bar.over>i{background:linear-gradient(180deg,#d77a6e,#b44c40)}
  .chip.on::before{color:var(--orange)}
  .tabs button.on{color:var(--orange)}

  .date-badge{background:var(--orange-fill);border:1px solid #b96f12;color:#fff;font-weight:700;text-shadow:0 1px 1px rgba(10,30,90,.35)}

  /* ===== 方框無邊線，只用柔和陰影 ===== */
  .card,.card.income,.grid3 div,.banner,.readonly,input,select,.btn,.chip,.del,.tabs button,.tabs button.on,#fab,.cycle-nav button,.date-badge,.sheet{border:0!important;background-origin:border-box}
  .tabs{border-top:0}
  .chip.on{border-color:transparent}
  input:focus,select:focus{box-shadow:var(--press),0 0 0 2px rgba(31,95,230,.30)}

  /* 記帳按鈕：橘底白字圓形 */
  #fab{width:84px;height:84px;padding:0;border-radius:50%!important;background:var(--orange-fill)!important;color:#fff!important;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;bottom:82px;
    box-shadow:6px 6px 16px rgba(40,80,170,.35),-5px -5px 12px var(--hi)!important;text-shadow:0 1px 1px rgba(10,30,90,.3)}
  #fab.hidden{display:none}
  #fab svg{filter:drop-shadow(0 1px 1px rgba(10,30,90,.3))}
  #fab:active{background:linear-gradient(180deg,#1a52dc,#1545bd)!important;box-shadow:inset 3px 3px 7px rgba(10,30,90,.35)!important}
  #app{padding-bottom:200px}

  /* 整體調亮 */
  :root{
    --bg:#f1f2f4; --card:#f5f6f8; --line:#d9dbdf; --rim:#cfd2d7;
    --hi:#ffffff; --lo:#d5d8dd; --muted:#8c9097; --accent-soft:#e6e8eb;
    --knob: linear-gradient(160deg,#ffffff 0%,#f0f1f3 55%,#e3e5e8 100%);
  }
  .grid3 div,.banner,.readonly,.pct,.btag,input,select,.bar,.share,.tabs button.on{background:var(--bg)}
  .chip.on{background:#e6e8eb}
  .erow+.erow,.hrow+.hrow{border-top-color:#e4e6e9}
  .tabs{background:var(--bg)}

  /* 藍色主題：進度條用藍→青漸層，跟參考圖一樣 */
  .bar>i{background:linear-gradient(90deg,#1f5fe6,#3fd6e0)}
  .bar.over>i{background:linear-gradient(180deg,#d77a6e,#b44c40)}

  /* 新增收入／新增預期支出：藍底白字 */
  #sAdd,#sAddInc{background:var(--orange-fill)!important;color:#fff!important;box-shadow:5px 5px 12px rgba(40,80,170,.30),-4px -4px 10px var(--hi)!important}
  #sAdd:active,#sAddInc:active{background:linear-gradient(180deg,#1a52dc,#1545bd)!important;box-shadow:inset 3px 3px 7px rgba(10,30,90,.35)!important}

  /* 凹陷變淺 */
  :root{ --press: inset 1.5px 1.5px 3px #dcdfe3, inset -1.5px -1.5px 3px #ffffff; }
  .bar,.share{box-shadow:inset 1px 1px 2px #dcdfe3, inset -1px -1px 2px #ffffff}
  input:focus,select:focus{box-shadow:var(--press),0 0 0 2px rgba(31,95,230,.25)}

  /* 歷史頁：拿掉總花費上方灰線，已儲蓄/投資跟總花費一樣大 */
  .htotal{border-top:0!important;margin-top:4px;padding-top:6px}
  .htotal.hsave{margin-top:0;padding-top:4px}

  .tabs button[data-tab=settings]{display:flex;align-items:center;justify-content:center}
  .tabs button svg{display:block}

  /* 記帳按鈕放大兩倍 */
  #fab{width:168px!important;height:168px!important;bottom:84px}
  #fab svg{width:100px;height:100px}
  #app{padding-bottom:290px}

  /* 發薪日提示泡泡（在齒輪上方） */
  .tips{position:fixed;z-index:15;bottom:calc(76px + env(safe-area-inset-bottom));right:max(10px, calc(50% - 240px + 10px));display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}
  .tip{position:relative;pointer-events:auto;
    background:var(--orange-fill);color:#fff;border:0;border-radius:14px;padding:10px 14px;font-size:13.5px;font-weight:400;line-height:1.5;text-align:left;
    box-shadow:0 8px 18px rgba(30,70,170,.35);cursor:pointer;font-family:inherit;animation:tipIn .3s ease-out}
  .tip.last::after{content:"";position:absolute;right:46px;bottom:-7px;border:8px solid transparent;border-bottom:0;border-top-color:#1a52dc}
  .tip.hidden{display:none}
  @keyframes tipIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* 設定頁內的提示：指向對應的輸入欄 */
  .itip{position:relative;display:block;width:max-content;max-width:calc(50% + 30px);margin:2px 0 12px calc(50% - 30px);
    background:var(--orange-fill);color:#fff;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:400;line-height:1.4;
    box-shadow:0 6px 14px rgba(30,70,170,.28);animation:tipIn .3s ease-out}
  .itip[hidden]{display:none}
  .itip.up::before{content:"";position:absolute;left:28px;top:-7px;border:8px solid transparent;border-top:0;border-bottom-color:#3d7bf5}
  .itip.down{margin:4px auto 12px}
  .itip.down::after{content:"";position:absolute;left:50%;margin-left:-8px;bottom:-7px;border:8px solid transparent;border-bottom:0;border-top-color:#1a52dc}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="cycle-nav">
      <button id="prevC" aria-label="上一期">‹</button>
      <div class="cycle-mid"><div class="date-badge" id="cycleDate"></div><div class="cycle-title"><div class="t" id="cycleLabel"></div><div class="s" id="cycleSub"></div></div></div>
      <button id="nextC" aria-label="下一期">›</button>
    </div>
  </header>
  <main id="view"></main>
  <button id="fab" aria-label="記一筆支出" title="記一筆支出"><svg viewBox="0 0 48 48" width="50" height="50" aria-hidden="true"><path d="M24 6v36M6 24h36" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/></svg></button>
  <nav class="tabs">
    <button data-tab="budget" class="on">收入與預期支出</button>
    <button data-tab="history">儲蓄與投資</button>
    <button data-tab="settings" aria-label="設定" title="設定"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" stroke="currentColor" stroke-width="1" stroke-linejoin="round" d="M9.55 4.07 L9.81 1.22 L14.19 1.22 L14.45 4.07 L15.87 4.66 L18.08 2.83 L21.17 5.92 L19.34 8.13 L19.93 9.55 L22.78 9.81 L22.78 14.19 L19.93 14.45 L19.34 15.87 L21.17 18.08 L18.08 21.17 L15.87 19.34 L14.45 19.93 L14.19 22.78 L9.81 22.78 L9.55 19.93 L8.13 19.34 L5.92 21.17 L2.83 18.08 L4.66 15.87 L4.07 14.45 L1.22 14.19 L1.22 9.81 L4.07 9.55 L4.66 8.13 L2.83 5.92 L5.92 2.83 L8.13 4.66 Z M7.6 12 a4.4 4.4 0 1 0 8.8 0 a4.4 4.4 0 1 0 -8.8 0 Z"/></svg></button>
  </nav>
</div>

<div class="mask hidden" id="mask">
  <form class="sheet" id="sheet" autocomplete="off">
    <h2>記一筆支出</h2>
    <div class="field"><label>金額</label><input class="amount-in" id="fAmt" type="text" inputmode="decimal" enterkeyhint="done" placeholder="0"></div>
    <div class="field"><label>扣在哪筆預期支出</label><div class="chips" id="fChips"></div></div>
    <div class="field"><label>日期</label><input id="fDate" type="date"></div>
    <div class="field"><label>備註（可不填）</label><input id="fNote" type="text" maxlength="40" placeholder="例如：午餐便當"></div>
    <div class="row"><button type="button" class="btn ghost" id="fCancel">取消</button><button type="submit" class="btn primary">儲存</button></div>
  </form>
</div>
<div class="tips"><button id="newCycleTip" class="tip hidden" type="button">尚未填寫本期收入！<br>點這裡填寫</button><button id="budgetTip" class="tip hidden" type="button">尚未填寫預期支出！<br>點這裡填寫</button></div>
<div id="toast"></div>

<script>
(function(){
  "use strict";
  const KEY = 'payday-budget-v1';
  const CARRY = 'carry';
  const COLORS = ['#5f8270','#c09a68','#7090b0','#a87e90','#8f9a66','#8a80ae','#629a98','#7c86b4','#90939a'];

  // ---------- 儲存 ----------
  let memCopy = null;
  function load(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return memCopy ? JSON.parse(memCopy) : null; } }
  function save(){ const j = JSON.stringify(S); memCopy = j; try{ localStorage.setItem(KEY, j); }catch(e){} }

  // ---------- 日期工具 ----------
  const pad = n => String(n).padStart(2,'0');
  const fmt = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
  const dim = (y,m) => new Date(y, m+1, 0).getDate();
  const paydayOf = (y,m,day) => new Date(y, m, Math.min(day, dim(y,m)));
  function nextPaydayAfter(s, day){ // 嚴格大於 s 的下一個發薪日
    const d = parse(s); const c = paydayOf(d.getFullYear(), d.getMonth(), day);
    if (c > d) return fmt(c);
    const n = new Date(d.getFullYear(), d.getMonth()+1, 1);
    return fmt(paydayOf(n.getFullYear(), n.getMonth(), day));
  }
  function lastPaydayOnOrBefore(s, day){
    const d = parse(s); const c = paydayOf(d.getFullYear(), d.getMonth(), day);
    if (c <= d) return fmt(c);
    const p = new Date(d.getFullYear(), d.getMonth()-1, 1);
    return fmt(paydayOf(p.getFullYear(), p.getMonth(), day));
  }
  const diffDays = (a,b) => Math.round((parse(b) - parse(a)) / 86400000);
  const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return fmt(d); };
  const md = s => { const d = parse(s); return (d.getMonth()+1)+'/'+d.getDate(); };
  const periodName = c => (parse(c.start).getMonth()+1) + '月期';
  const range = c => md(c.start) + '－' + md(addDays(c.end,-1));
  const realToday = () => fmt(new Date());
  const today = () => realToday();

  // ---------- 其他工具 ----------
  const uid = () => Math.random().toString(36).slice(2,10);
  const money = n => (n < 0 ? '-' : '') + '$' + Math.round(Math.abs(n)).toLocaleString('zh-TW');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  // 把輸入轉成數字：支援全形數字、千分位逗號、全形負號
  function toNum(v){
    const t = String(v||'').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .replace(/[－−—]/g,'-').replace(/[．。]/g,'.').replace(/[,，\s$＄]/g,'');
    const n = parseFloat(t); return isFinite(n) ? n : 0;
  }
  const sumExp = list => list.reduce((a,e) => a + e.amount, 0);
  const spentOf = (c, bid) => sumExp(c.expenses.filter(e => e.budgetId === bid));
  const totalBudget = c => c.budgets.reduce((a,b) => a + b.amount, 0);
  // 名稱含「儲蓄」或「投資」的預算，算作儲蓄/投資
  const isSaving = b => /儲蓄|投資/.test(b.name);
  const savedOf = c => c.budgets.filter(isSaving).reduce((a,b) => a + spentOf(c, b.id), 0);
  // 有填金額、或已經有花費的項目才顯示
  const shown = c => c.budgets.filter(b => b.amount > 0 || spentOf(c, b.id) > 0);
  const incomeTotal = c => (c.carry||0) + c.incomes.reduce((a,x) => a + x.amount, 0);
  let toastT;
  function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

  // ---------- 資料初始化 ----------
  let S = load();
  if (!S){
    const t = realToday(), day = 5;
    const start = lastPaydayOnOrBefore(t, day);
    S = { payday: day, fakeToday: null, firstRun: true, cycles: [{
      start, end: nextPaydayAfter(start, day),
      budgets: [
        ...['餐飲','交通','娛樂','寵物用品','機車','房租','貸款','儲蓄','投資'].map(name => ({ id: uid(), name, amount: 0 }))
      ],
      carry: 0, carryAuto: 0,
      incomes: [{ id: uid(), name: '薪資', amount: 0 }],
      expenses: []
    }]};
    save();
  }
  // 舊版資料轉換：上月結餘從「預算」搬到「收入」
  S.cycles.forEach(c => {
    if (!c.incomes) c.incomes = [];
    const old = c.budgets.find(b => b.carry);
    if (old){
      if (c.carry === undefined){ c.carry = old.amount; c.carryAuto = old.amount; }
      if (c.expenses.some(e => e.budgetId === old.id)){ delete old.carry; old.id = 'old-carry'; c.expenses.forEach(e => { if (e.budgetId === CARRY) e.budgetId = 'old-carry'; }); old.name = '上月結餘（舊）'; }
      else c.budgets = c.budgets.filter(b => b !== old);
    }
    if (c.carry === undefined){ c.carry = 0; c.carryAuto = 0; }
  });
  save();

  // 過了發薪日 → 自動開新的一期，把上一期剩下的錢全部歸入「上月結餘」
  function rollover(){
    let cur = S.cycles[S.cycles.length-1], changed = false;
    const t = today();
    while (t >= cur.end){
      const left = incomeTotal(cur) - sumExp(cur.expenses);   // 收入合計（含上月結餘）－ 總花費
      const budgets = cur.budgets.map(b => ({ id: b.id, name: b.name, amount: b.amount }));
      const start = cur.end;
      const incomes = (cur.incomes||[]).map(x => ({ id: x.id, name: x.name, amount: 0 }));   // 收入只留名稱，金額每期重填
      cur = { start, end: nextPaydayAfter(start, S.payday), carry: left, carryAuto: left, budgets, incomes, expenses: [] };
      S.cycles.push(cur); changed = true;
    }
    if (changed) save();
    return changed;
  }

  // ---------- 畫面狀態 ----------
  let tab = 'budget';
  let viewIdx = S.cycles.length - 1;
  const open = {};           // 哪些預算卡片展開
  let armed = null;          // 兩段式刪除用
  const curCycle = () => S.cycles[S.cycles.length-1];
  const isCurrent = () => viewIdx === S.cycles.length - 1;
  const viewCycle = () => S.cycles[viewIdx];
  function daysLeft(c){ const t = today(); const from = t < c.start ? c.start : t; return Math.max(1, diffDays(from, c.end)); }

  function renderHeader(){
    const c = viewCycle();
    document.getElementById('cycleDate').textContent = md(today());   // 顯示今天日期
    document.getElementById('cycleLabel').textContent = periodName(c);
    document.getElementById('cycleSub').innerHTML = isCurrent()
      ? '<span>距離下次發薪日（' + md(c.end) + '）</span><span>還有 ' + daysLeft(c) + ' 天</span>'
      : '<span>已結束</span><span>（' + range(c) + '）</span>';
    document.getElementById('prevC').disabled = viewIdx === 0 || tab === 'settings';
    document.getElementById('nextC').disabled = isCurrent();
    document.getElementById('fab').classList.toggle('hidden', !isCurrent() || tab === 'settings' || tab === 'history');
  }

  function expenseRow(c, e, opts){
    const b = c.budgets.find(x => x.id === e.budgetId);
    const pct = b && b.amount > 0 ? (e.amount / b.amount * 100) : null;
    const pctTxt = pct === null ? '—' : (pct >= 10 ? pct.toFixed(0) : pct.toFixed(1)) + '%';
    const delBtn = isCurrent() ? '<button class="del'+(armed===e.id?' armed':'')+'" data-del="'+e.id+'">'+(armed===e.id?'確定刪除':'刪除')+'</button>' : '';
    return '<div class="erow"><div class="l"><div class="n">'
      + (opts.showBudget && b ? '<span class="btag">'+esc(b.name)+'</span>' : '')
      + esc(e.note || '（無備註）') + '</div><div class="d">' + md(e.date) + '</div></div>'
      + '<div class="r">' + money(e.amount) + '<span class="pct" title="佔該預期支出比例">佔'+pctTxt+'</span>' + delBtn + '</div></div>';
  }
  const sortExp = list => list.slice().sort((a,b) => (b.date.localeCompare(a.date)) || (b.ts - a.ts));

  function renderBudget(){
    const c = viewCycle(), dl = daysLeft(c), cur = isCurrent();
    let h = '';
    if (S.firstRun && cur) h += '<div class="banner">已備好常用項目，到「設定」填金額就會顯示在這裡。</div>';
    if (!cur) h += '<div class="readonly">這是已結束的期別，只能查看。</div>';
    h += summaryCard(c);
    {
      const inc = incomeTotal(c), sp = sumExp(c.expenses), rem = inc - sp;
      const ratio = inc > 0 ? Math.min(1, Math.max(0, sp / inc)) : (sp > 0 ? 1 : 0);
      const over = rem < 0;
      h += '<div class="card income">'
        + '<div class="bhead" style="align-items:center"><div class="bname">'+periodName(c)+'收入</div>'
        + '<div class="amt" style="font-size:22px;font-weight:800">'+money(inc)+'</div></div>'
        + '<div class="bar'+(over?' over':'')+'"><i style="width:'+(ratio*100).toFixed(1)+'%"></i></div>'
        + (inc === 0 && cur ? '<div class="hint">尚未填寫收入，請到「設定」填寫。</div>' : '')
        + '</div><h3>'+periodName(c)+'預期支出</h3>';
    }
    if (!shown(c).length) h += '<div class="card"><div class="empty">尚無項目，請到「設定」填金額。</div></div>';
    shown(c).forEach(b => {
      const spent = spentOf(c, b.id), remain = b.amount - spent;
      const ratio = b.amount > 0 ? Math.min(1, spent / b.amount) : (spent > 0 ? 1 : 0);
      const over = remain < 0;
      const daily = remain / dl;
      const list = sortExp(c.expenses.filter(e => e.budgetId === b.id));
      h += '<div class="card bcard" data-card="'+b.id+'">'
        + '<div class="bhead"><div class="bname">'+esc(b.name)+'</div>'
        + '<div class="bremain">剩 <b'+(remain<0?' class="neg"':'')+'>'+money(remain)+'</b> / '+money(b.amount)+'</div></div>'
        + '<div class="bar'+(over?' over':'')+'"><i style="width:'+(ratio*100).toFixed(1)+'%"></i></div>'
        + '<div class="daily">'
        + (cur ? '<span>每日可用（剩 '+dl+' 天）</span><span class="v'+(over?' neg':'')+'">'+(over?'已超支 '+money(-remain):money(daily))+'</span>'
               : '<span>花了 '+money(spent)+'</span><span class="v'+(over?' neg':'')+'">'+(over?'超支 '+money(-remain):'結餘 '+money(remain))+'</span>')
        + '</div>';
      if (open[b.id]){
        h += '<div class="elist">' + (list.length ? list.map(e => expenseRow(c, e, {showBudget:false})).join('') : '<div class="empty">尚無花費</div>') + '</div>';
      }
      h += '</div>';
    });
    if (shown(c).length) h += '<div class="hint" style="text-align:center">點卡片可看花費明細</div>';
    return h;
  }

  function summaryCard(c){
    const tb = totalBudget(c), ts = sumExp(c.expenses), dl = daysLeft(c);
    let h = '<div class="card"><div class="label">'+periodName(c)+'總花費</div><div class="big">'+money(ts)+'</div>'
      + '<div class="label" style="margin-top:2px">已儲蓄/投資 <b class="pos" style="font-size:15px">'+money(savedOf(c))+'</b></div>'
      + '<div class="grid3"><div><span class="label">總預期支出</span><b>'+money(tb)+'</b></div>'
      + '<div><span class="label">總剩餘</span><b'+(tb-ts<0?' class="neg"':'')+'>'+money(tb-ts)+'</b></div>'
      + '<div><span class="label">'+(isCurrent()?'每日可用':'支出筆數')+'</span><b>'+(isCurrent()?money((tb-ts)/dl):c.expenses.length+' 筆')+'</b></div></div>';
    if (ts > 0){
      h += '<div class="share">';
      c.budgets.forEach((b,i) => { const s = spentOf(c,b.id); if (s>0) h += '<i style="width:'+(s/ts*100)+'%;background:'+COLORS[i%COLORS.length]+'"></i>'; });
      h += '</div><div class="legend">';
      c.budgets.forEach((b,i) => { const s = spentOf(c,b.id); if (s>0) h += '<span style="--c:'+COLORS[i%COLORS.length]+'">'+esc(b.name)+' '+money(s)+'（'+(s/ts*100).toFixed(0)+'%）</span>'; });
      h += '</div>';
    }
    h += '</div>';
    return h;
  }

  function renderHistory(){
    const past = S.cycles.slice(0, -1).reverse();
    if (!past.length) return '<div class="card"><div class="empty">過了下次發薪日，這裡會出現上一期紀錄。</div></div>';
    return past.map(c => {
      const ts = sumExp(c.expenses), tb = totalBudget(c);
      let h = '<h3>'+parse(c.start).getFullYear()+'年 '+periodName(c)+'（'+range(c)+'）</h3><div class="card">';
      shown(c).forEach(b => {
        const sp = spentOf(c, b.id);
        h += '<div class="hrow"><span>'+esc(b.name)+'</span><span>'+money(sp)+' <span class="sub">/ 預期 '+money(b.amount)+'</span>'
          + (sp > b.amount ? ' <span class="neg sub">超支</span>' : '') + '</span></div>';
      });
      h += '<div class="htotal"><span>總花費</span><span class="v'+(ts>tb?' neg':'')+'">'+money(ts)+' <span class="sub" style="font-weight:400">/ '+money(tb)+'</span></span></div>'
        + '<div class="htotal hsave"><span>已儲蓄/投資</span><span class="v pos">'+money(savedOf(c))+'</span></div></div>';
      return h;
    }).join('');
  }

  function allocHTML(c){
    const inc = incomeTotal(c);
    const bud = totalBudget(c);
    const r = inc - bud;
    return '<div class="alloc"><span>收入合計（含上月結餘）</span><span>'+money(inc)+'</span></div>'
      + '<div class="alloc"><span>預期支出合計</span><span>'+money(bud)+'</span></div>'
      + '<div class="alloc res"><span>預期支出分配狀況</span><span class="v '+(r<0?'neg':'pos')+'">'+(r>0?'+':'')+money(r)+'</span></div>'
      + '<div class="hint">'+(r<0?'超出收入 '+money(-r):r>0?'尚有 '+money(r)+' 未分配':'剛好分配完')+'</div>';
  }
  function updateTip(incomes, budgets){
    const c = curCycle();
    const list = incomes || c.incomes.map(x => x.amount);
    const need = !list.some(v => v > 0);   // 只要收入是空的就顯示
    const blist = budgets || c.budgets.map(b => b.amount);
    const needB = !blist.some(v => v > 0); // 只要預期支出全是空的就顯示
    const t1 = document.getElementById('newCycleTip'), t2 = document.getElementById('budgetTip');
    const inSet = tab === 'settings';
    t1.classList.toggle('hidden', !need || inSet); t2.classList.toggle('hidden', !needB || inSet);
    const i1 = document.getElementById('inTipInc'), i2 = document.getElementById('inTipBud');
    if (i1) i1.hidden = !need; if (i2) i2.hidden = !needB;
    t1.classList.toggle('last', need && !(needB && !inSet)); t2.classList.toggle('last', needB);
  }
  document.getElementById('budgetTip').addEventListener('click', () => {
    tab = 'settings'; armed = null; render();
    const f = document.querySelector('[data-am]');
    if (f){ f.scrollIntoView({block:'center'}); f.focus({preventScroll:true}); }
  });
  document.getElementById('newCycleTip').addEventListener('click', () => {
    tab = 'settings'; armed = null; render(); window.scrollTo(0,0);
    const f = document.querySelector('[data-iam]'); if (f) f.focus();
  });
  function liveAlloc(){
    const c = curCycle(), el = document.getElementById('allocBox'); if (!el) return;
    const ci = document.getElementById('sCarry');
    const tmp = { carry: ci ? Math.round(toNum(ci.value)||0) : c.carry, incomes: c.incomes.map(x => { const i = document.querySelector('[data-iam="'+x.id+'"]'); return { amount: i ? Math.max(0, toNum(i.value)||0) : x.amount }; }),
                  budgets: c.budgets.map(b => { const i = document.querySelector('[data-am="'+b.id+'"]'); return { amount: i ? Math.max(0, toNum(i.value)||0) : b.amount }; }) };
    el.innerHTML = allocHTML(tmp);
    updateTip(tmp.incomes.map(x => x.amount), tmp.budgets.map(b => b.amount));
  }

  function renderSettings(){
    const c = curCycle();
    let opts = ''; for (let d=1; d<=31; d++) opts += '<option value="'+d+'"'+(d===S.payday?' selected':'')+'>每月 '+d+' 號</option>';
    let h = '<h3>發薪日</h3><div class="card"><select id="sPay">'+opts+'</select>'
      + '<div class="hint">沒有該日的月份以月底計。修改後，本期延到新發薪日結束。</div></div>';
    h += '<h3>'+periodName(c)+'收入</h3><div class="card">';
    h += '<div class="brow"><input class="nm" value="上月結餘" disabled>'
      + '<input class="am" id="sCarry" type="text" inputmode="numeric" placeholder="0" value="'+(c.carry||'')+'"><span style="width:44px"></span></div>';
    h += '<div class="hint" style="margin:-2px 0 10px">自動帶入上期剩餘的錢，可手動修改。'
      + (c.carry !== c.carryAuto ? ' <a href="#" id="sCarryReset" style="color:var(--accent)">恢復自動（'+money(c.carryAuto)+'）</a>' : '') + '</div>';
    const noInc = !c.incomes.some(x => x.amount > 0), noBud = !c.budgets.some(b => b.amount > 0);
    c.incomes.forEach((x, i) => {
      h += '<div class="brow"><input class="nm" data-inm="'+x.id+'" value="'+esc(x.name)+'" maxlength="12">'
        + '<input class="am" data-iam="'+x.id+'" type="text" inputmode="numeric" placeholder="0" value="'+(x.amount||'')+'">'
        + '<button class="del'+(armed==='i'+x.id?' armed':'')+'" data-idel="'+x.id+'">'+(armed==='i'+x.id?'確定':'刪除')+'</button></div>';
      if (i === 0) h += '<div class="itip up" id="inTipInc"'+(noInc?'':' hidden')+'>尚未填寫本期收入！<br>在上面填入金額</div>';
    });
    if (!c.incomes.length) h += '<div class="itip down" id="inTipInc"'+(noInc?'':' hidden')+'>尚未填寫本期收入！按下面新增一筆</div>';
    h += '<button class="btn ghost" id="sAddInc" style="width:100%;margin-top:4px">＋ 新增一筆收入</button>'
      + '<div class="hint">下一期只保留名稱，金額需重填。</div></div>';
    h += '<h3>'+periodName(c)+'預期支出</h3><div class="card">';
    c.budgets.forEach(b => {
        h += '<div class="brow"><input class="nm" data-nm="'+b.id+'" value="'+esc(b.name)+'" maxlength="12">'
          + '<input class="am" data-am="'+b.id+'" type="text" inputmode="numeric" placeholder="0" value="'+(b.amount||'')+'">'
          + '<button class="del'+(armed==='b'+b.id?' armed':'')+'" data-bdel="'+b.id+'">'+(armed==='b'+b.id?'確定':'刪除')+'</button></div>';
      if (b === c.budgets[0]) h += '<div class="itip up" id="inTipBud"'+(noBud?'':' hidden')+'>尚未填寫預期支出！<br>在上面填入金額</div>';
    });
    if (!c.budgets.length) h += '<div class="itip down" id="inTipBud"'+(noBud?'':' hidden')+'>尚未填寫預期支出！按下面新增一筆</div>';
    h += '<button class="btn ghost" id="sAdd" style="width:100%;margin-top:4px">＋ 新增一筆預期支出</button><div class="hint">項目和金額會帶到下一期；金額為 0 的不顯示。</div></div>';
    h += '<h3>'+periodName(c)+'預期支出分配狀況</h3><div class="card" id="allocBox">'+allocHTML(c)+'</div>';
    h += '<h3>其他</h3><div class="card">'
      + '<button class="btn danger'+(armed==='reset'?' armed':'')+'" id="sReset" style="width:100%">'+(armed==='reset'?'再按一次確定清除':'清除所有資料，重新開始')+'</button>'
      + '<div class="hint">會刪除這支手機上的所有紀錄，無法復原。</div></div>';
    return h;
  }

  function render(){
    rollover();
    if (viewIdx > S.cycles.length-1) viewIdx = S.cycles.length-1;
    if (tab === 'settings') viewIdx = S.cycles.length-1;
    renderHeader();
    updateTip();
    const v = document.getElementById('view');
    v.innerHTML = tab === 'budget' ? renderBudget() : tab === 'history' ? renderHistory() : renderSettings();
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  }

  // ---------- 事件 ----------
  document.querySelector('.tabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    tab = b.dataset.tab; armed = null; render(); window.scrollTo(0,0);
  });
  document.getElementById('prevC').onclick = () => { if (viewIdx>0){ viewIdx--; armed=null; render(); } };
  document.getElementById('nextC').onclick = () => { if (!isCurrent()){ viewIdx++; armed=null; render(); } };

  document.getElementById('view').addEventListener('click', e => {
    const del = e.target.closest('[data-del]');
    if (del){
      e.stopPropagation();
      const id = del.dataset.del;
      if (armed === id){ const c = curCycle(); c.expenses = c.expenses.filter(x => x.id !== id); armed = null; save(); toast('已刪除'); }
      else armed = id;
      render(); return;
    }
    const bdel = e.target.closest('[data-bdel]');
    if (bdel){
      const id = bdel.dataset.bdel, c = curCycle();
      if (c.expenses.some(x => x.budgetId === id)){ toast('已有花費紀錄，無法刪除'); return; }
      if (armed === 'b'+id){ c.budgets = c.budgets.filter(b => b.id !== id); armed = null; save(); toast('已刪除'); }
      else armed = 'b'+id;
      render(); return;
    }
    const idel = e.target.closest('[data-idel]');
    if (idel){
      const id = idel.dataset.idel, c = curCycle();
      if (armed === 'i'+id){ c.incomes = c.incomes.filter(x => x.id !== id); armed = null; save(); toast('已刪除收入'); }
      else armed = 'i'+id;
      render(); return;
    }
    if (e.target.id === 'sCarryReset'){ e.preventDefault(); const c = curCycle(); c.carry = c.carryAuto; save(); render(); toast('已恢復自動金額'); return; }
    if (e.target.id === 'sAddInc'){
      curCycle().incomes.push({ id: uid(), name: '新收入', amount: 0 }); save(); render();
      const ins = document.querySelectorAll('[data-inm]'); const last = ins[ins.length-1]; last && last.select(); return;
    }
    if (e.target.id === 'sAdd'){
      curCycle().budgets.push({ id: uid(), name: '新項目', amount: 0 }); S.firstRun = false; save(); render();
      const ins = document.querySelectorAll('[data-nm]'); const last = ins[ins.length-1]; last && last.select(); return;
    }
    if (e.target.id === 'sFakeGo'){
      const v = document.getElementById('sFake').value;
      if (!v) return;
      if (v < curCycle().start){ toast('只能往後調'); return; }
      S.fakeToday = v === realToday() ? null : v; save();
      const before = S.cycles.length; render();
      toast(S.cycles.length > before ? '已進入新的一期' : '已套用');
      return;
    }
    if (e.target.id === 'sFakeOff'){
      if (realToday() < curCycle().start){ toast('請先清除資料'); return; }
      S.fakeToday = null; save(); render(); toast('已回到真實日期'); return;
    }
    if (e.target.id === 'sReset'){
      if (armed === 'reset'){ try{ localStorage.removeItem(KEY); }catch(_){} memCopy = null; location.reload(); return; }
      armed = 'reset'; render(); return;
    }
    const card = e.target.closest('[data-card]');
    if (card){ const id = card.dataset.card; open[id] = !open[id]; armed = null; render(); }
  });

  document.getElementById('view').addEventListener('change', e => {
    const t = e.target, c = curCycle();
    if (t.id === 'sPay'){
      S.payday = Number(t.value);
      c.end = nextPaydayAfter(today() < c.start ? c.start : today(), S.payday);
      S.firstRun = false; save(); render(); toast('發薪日已改為每月 '+S.payday+' 號'); return;
    }
    if (t.dataset.nm){ const b = c.budgets.find(x => x.id === t.dataset.nm); const v = t.value.trim(); if (b && v){ b.name = v; S.firstRun=false; save(); } else render(); return; }
    if (t.id === 'sCarry'){ c.carry = Math.round(toNum(t.value)); t.value = c.carry || ''; save(); liveAlloc(); return; }
    if (t.dataset.inm){ const x = c.incomes.find(i => i.id === t.dataset.inm); const v = t.value.trim(); if (x && v){ x.name = v; save(); } else render(); return; }
    if (t.dataset.iam){ const x = c.incomes.find(i => i.id === t.dataset.iam); if (x){ x.amount = Math.max(0, Math.round(toNum(t.value))); t.value = x.amount || ''; save(); liveAlloc(); } return; }
    if (t.dataset.am){ const b = c.budgets.find(x => x.id === t.dataset.am); const v = Math.max(0, Math.round(toNum(t.value))); t.value = v || ''; if (b){ b.amount = v; S.firstRun=false; save(); liveAlloc(); } return; }
  });

  document.getElementById('view').addEventListener('input', e => { if (e.target.dataset.iam || e.target.dataset.am || e.target.id === 'sCarry') liveAlloc(); });

  // ---------- 記一筆 ----------
  const mask = document.getElementById('mask');
  let pick = null;
  function openSheet(){
    const c = curCycle();
    const choices = shown(c);
    if (!choices.length){ toast('請先到設定填金額'); return; }
    if (!pick || !choices.some(b => b.id === pick)) pick = choices[0].id;
    document.getElementById('fChips').innerHTML = choices.map(b => {
      const r = b.amount - spentOf(c, b.id);
      return '<button type="button" class="chip'+(b.id===pick?' on':'')+'" data-pick="'+b.id+'">'+esc(b.name)+'<small>剩'+money(r)+'</small></button>';
    }).join('');
    const d = document.getElementById('fDate');
    d.min = c.start; d.max = addDays(c.end, -1); d.value = today();
    document.getElementById('fAmt').value = ''; document.getElementById('fNote').value = '';
    mask.classList.remove('hidden');
    setTimeout(() => document.getElementById('fAmt').focus(), 50);
  }
  document.getElementById('fab').onclick = openSheet;
  document.getElementById('fCancel').onclick = () => mask.classList.add('hidden');
  mask.addEventListener('click', e => { if (e.target === mask) mask.classList.add('hidden'); });
  document.getElementById('fChips').addEventListener('click', e => {
    const b = e.target.closest('[data-pick]'); if (!b) return;
    pick = b.dataset.pick;
    document.querySelectorAll('[data-pick]').forEach(x => x.classList.toggle('on', x.dataset.pick === pick));
  });
  document.getElementById('sheet').addEventListener('submit', e => {
    e.preventDefault();
    const c = curCycle();
    const amt = toNum(document.getElementById('fAmt').value);
    const date = document.getElementById('fDate').value;
    if (!(amt > 0)){ toast('請輸入金額'); return; }
    if (!date || date < c.start || date >= c.end){ toast('日期需在 '+md(c.start)+'－'+md(addDays(c.end,-1))); return; }
    c.expenses.push({ id: uid(), ts: Date.now(), date, amount: Math.round(amt*100)/100, budgetId: pick, note: document.getElementById('fNote').value.trim() });
    S.firstRun = false; save();
    mask.classList.add('hidden'); render();
    const b = c.budgets.find(x => x.id === pick);
    toast('已記到「'+b.name+'」');
  });

  render();
})();
</script>
</body>
</html>
