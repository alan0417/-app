<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>發薪日預算</title>
<style>
  :root{
    --bg:#f5f2ec; --card:#fffdf9; --ink:#1f2a24; --muted:#6f776f; --line:#e4dfd5;
    --accent:#2f6b4f; --accent-soft:#e3efe7; --warn:#c0492f; --warn-soft:#f8e4de; --carry:#8a6a2c; --carry-soft:#f3ead6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    -webkit-tap-highlight-color:transparent}
  #app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:140px;position:relative}
  header{padding:16px 8px 8px;position:sticky;top:0;background:var(--bg);z-index:5}
  .cycle-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .cycle-nav button{border:0;background:transparent;font-size:26px;color:var(--muted);width:30px;flex:none;height:40px;border-radius:20px;cursor:pointer}
  .cycle-nav button:disabled{opacity:.2;cursor:default}
  .cycle-mid{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
  .date-badge{background:#244c9c;color:#fff;border-radius:12px;padding:6px 12px;font-size:clamp(24px,7.5vw,30px);font-weight:500;line-height:1.1;flex:none;letter-spacing:.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .cycle-title{text-align:left;min-width:0}
  .cycle-title .t{font-weight:800;font-size:19px}
  .cycle-title .s span{white-space:nowrap}
  .cycle-title .s{font-size:clamp(11.5px,3.3vw,13px);color:var(--muted);margin-top:3px;line-height:1.4}
  main{padding:4px 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
  .bcard{cursor:pointer}
  .card.income{border-color:#cfe0d5;background:linear-gradient(180deg,#f3f9f5,#fffdf9)}
  .bhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .bname{font-weight:700;font-size:16px}
  .tag{font-size:11px;padding:2px 7px;border-radius:9px;background:var(--carry-soft);color:var(--carry);margin-left:6px;font-weight:600;vertical-align:2px}
  .bremain{font-size:13px;color:var(--muted);text-align:right}
  .bremain b{color:var(--ink);font-size:15px}
  .bar{height:8px;background:#ece7dd;border-radius:4px;margin:10px 0 8px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
  .bar.over>i{background:var(--warn)}
  .bar.carry>i{background:var(--carry)}
  .daily{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
  .daily .v{font-size:20px;font-weight:700;color:var(--accent)}
  .daily .v.neg{color:var(--warn)}
  .elist{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}
  .erow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:14px;gap:8px}
  .erow+.erow{border-top:1px solid #f0ece4}
  .erow .l{min-width:0}
  .erow .d{font-size:12px;color:var(--muted)}
  .erow .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .erow .r{text-align:right;white-space:nowrap}
  .pct{font-size:12px;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:8px;margin-left:6px}
  .empty{color:var(--muted);font-size:13px;padding:6px 0}
  .big{font-size:34px;font-weight:800;letter-spacing:-.5px}
  .label{font-size:13px;color:var(--muted)}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
  .grid3 div{background:var(--bg);border-radius:10px;padding:8px}
  .grid3 b{display:block;font-size:15px;margin-top:2px}
  .share{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:12px 0 8px;background:#ece7dd}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
  .legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:5px}
  .btag{font-size:11px;padding:1px 6px;border-radius:8px;background:var(--accent-soft);color:var(--accent);margin-right:6px}
  .del{border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 6px;margin-left:4px;border-radius:6px}
  .del.armed{background:var(--warn);color:#fff}
  h3{font-size:14px;color:var(--muted);margin:18px 2px 8px;font-weight:600}
  .tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
  .tabs button{flex:1;border:0;background:transparent;padding:12px 0 14px;font-size:13.5px;white-space:nowrap;color:var(--muted);cursor:pointer;font-family:inherit}
  .tabs button.on{color:var(--accent);font-weight:700}
  .tabs button[data-tab=budget]{flex:1.6}
  #fab{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);border:0;background:var(--accent);color:#fff;font-size:16px;font-weight:700;padding:14px 28px;border-radius:28px;box-shadow:0 6px 18px rgba(47,107,79,.35);cursor:pointer;z-index:11;font-family:inherit}
  #fab.hidden{display:none}
  .mask{position:fixed;inset:0;background:rgba(20,25,22,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
  .mask.hidden{display:none}
  .sheet{background:var(--card);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px 18px 28px;max-height:90vh;overflow:auto}
  .sheet h2{margin:0 0 14px;font-size:18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input,select{font-family:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
  .amount-in{font-size:28px;font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:8px 14px;font-size:14px;cursor:pointer;font-family:inherit;color:var(--ink)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip small{opacity:.75;margin-left:4px}
  .row{display:flex;gap:8px}
  .btn{border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn.primary{background:var(--accent);color:#fff;flex:1}
  .btn.ghost{background:#efebe3;color:var(--ink)}
  .btn.danger{background:var(--warn-soft);color:var(--warn)}
  .btn.danger.armed{background:var(--warn);color:#fff}
  .brow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .brow input.nm{flex:1.3}
  .brow input.am{flex:1}
  .brow .fixed{flex:1;font-size:14px;color:var(--muted);padding:10px 4px}
  .hint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:6px}
  .banner{background:var(--carry-soft);color:var(--carry);font-size:13px;border-radius:12px;padding:10px 12px;margin-bottom:12px;line-height:1.5}
  .readonly{background:#efebe3;color:var(--muted);font-size:13px;border-radius:12px;padding:10px 12px;margin-bottom:12px}
  .hrow{display:flex;justify-content:space-between;font-size:14px;padding:6px 0}
  .hrow+.hrow{border-top:1px solid #f0ece4}
  .hrow .sub{color:var(--muted);font-size:12px}
  .htotal{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700}
  .htotal .v{font-size:20px}
  .alloc{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:14px}
  .alloc.res{border-top:2px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700}
  .alloc.res .v{font-size:22px}
  .pos{color:var(--accent)} .neg{color:var(--warn)}
  #toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:#1f2a24;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
  #toast.show{opacity:1}

  /* ===== 擬物風格（neumorphism）===== */
  :root{
    --bg:#e4e5e8; --card:#e9eaed; --ink:#3c4047; --muted:#878b92; --line:#c3c6cb;
    --accent:#4c5a66; --accent-soft:#d9dde1; --warn:#c2574a; --warn-soft:#ead9d6;
    --hi:#ffffff; --lo:#c3c6cc; --rim:#b7bac0;
    --raise: 6px 6px 14px var(--lo), -6px -6px 14px var(--hi);
    --raise-sm: 3px 3px 7px var(--lo), -3px -3px 7px var(--hi);
    --press: inset 3px 3px 7px var(--lo), inset -3px -3px 7px var(--hi);
    --knob: linear-gradient(160deg,#f7f8f9 0%,#e3e4e7 55%,#d3d5d9 100%);
  }
  html,body{background:var(--bg)}
  header{background:var(--bg)}
  .card{background:var(--card);border:1px solid var(--rim);border-radius:22px;box-shadow:var(--raise)}
  .card.income{background:var(--card);border-color:var(--rim)}
  .cycle-nav button{background:var(--knob);border:1px solid var(--rim);box-shadow:var(--raise-sm);width:34px;height:34px;font-size:18px;color:var(--muted)}
  .cycle-nav button:disabled{opacity:.35}
  .date-badge{box-shadow:var(--raise-sm), inset 0 1px 0 rgba(255,255,255,.25);border:1px solid #1d3d7e}
  .bar{background:var(--bg);box-shadow:inset 2px 2px 4px var(--lo), inset -2px -2px 4px var(--hi);height:10px;border-radius:6px}
  .bar>i{background:linear-gradient(180deg,#7c8792,#56616c)}
  .bar.over>i{background:linear-gradient(180deg,#d77a6e,#b44c40)}
  .share{box-shadow:inset 2px 2px 4px var(--lo), inset -2px -2px 4px var(--hi);background:var(--bg)}
  .grid3 div{background:var(--bg);box-shadow:var(--press);border-radius:14px}
  .daily .v{color:var(--ink)}
  .pos{color:#4f7a62}
  .pct{background:var(--bg);color:var(--accent);box-shadow:var(--press)}
  .btag{background:var(--bg);color:var(--accent);box-shadow:var(--press)}
  .banner,.readonly{background:var(--bg);color:var(--muted);box-shadow:var(--press);border:1px solid var(--rim)}
  input,select{background:var(--bg);border:1px solid var(--rim);box-shadow:var(--press);border-radius:14px}
  input:disabled{color:var(--muted)}
  input:focus,select:focus{outline:none;border-color:#8d939b}
  .btn,.chip,.del{background:var(--knob);border:1px solid var(--rim);box-shadow:var(--raise-sm);color:var(--ink)}
  .btn{border-radius:999px}
  .btn.primary{background:var(--knob);color:var(--ink)}
  .btn.ghost{background:var(--knob)}
  .btn.danger{color:var(--warn)}
  .btn:active,.chip:active,.del:active,#fab:active,.cycle-nav button:active:not(:disabled){box-shadow:var(--press);background:var(--bg)}
  .chip{border-radius:999px}
  .chip.on{background:#d6d9dd;color:var(--ink);border-color:#7f868f;box-shadow:var(--press);font-weight:700}
  .chip.on::before{content:"●";font-size:9px;margin-right:6px;vertical-align:2px;color:#4c5a66}
  .del{border-radius:999px;padding:5px 10px;font-size:12px;color:var(--muted)}
  .del.armed,.btn.danger.armed{background:var(--warn);color:#fff;border-color:var(--warn)}
  .tabs{background:var(--bg);border-top:1px solid var(--rim);padding:8px 10px calc(10px + env(safe-area-inset-bottom));gap:8px;box-shadow:0 -4px 12px rgba(0,0,0,.04)}
  .tabs button{border-radius:999px;padding:10px 0;border:1px solid transparent}
  .tabs button.on{background:var(--bg);box-shadow:var(--press);border-color:var(--rim);color:var(--ink)}
  #fab{background:var(--knob);color:var(--ink);border:1px solid var(--rim);box-shadow:8px 8px 18px rgba(150,154,162,.7), -6px -6px 14px var(--hi);bottom:84px}
  .sheet{background:var(--card);border-top:1px solid var(--rim)}
  .mask{background:rgba(60,64,71,.25)}
  #toast{background:#4a5058}
  h3{color:var(--muted)}
  .erow+.erow,.hrow+.hrow{border-top-color:#d6d8dc}
  .htotal,.alloc.res{border-top-color:var(--rim)}

  /* ===== 重點金額：橙色 ===== */
  :root{ --orange:#1f5fe6; --orange-fill:linear-gradient(180deg,#3d7bf5,#1a52dc); }
  .big,.amt,.daily .v,.grid3 b,.bremain b,.htotal .v,.pos,.alloc.res .v.pos{color:var(--orange)}
  .daily .v.neg,.grid3 b.neg,.htotal .v.neg,.bremain b.neg,.neg{color:var(--warn)}
  .bar>i{background:var(--orange-fill)}
  .bar.over>i{background:linear-gradient(180deg,#d77a6e,#b44c40)}
  .chip.on::before{color:var(--orange)}
  .tabs button.on{color:var(--orange)}

  .date-badge{background:var(--orange-fill);border:1px solid #b96f12;color:#fff;font-weight:700;text-shadow:0 1px 1px rgba(10,30,90,.35)}

  /* ===== 方框無邊線，只用柔和陰影 ===== */
  .card,.card.income,.grid3 div,.banner,.readonly,input,select,.btn,.chip,.del,.tabs button,.tabs button.on,#fab,.cycle-nav button,.date-badge,.sheet{border:0!important;background-origin:border-box}
  .tabs{border-top:0}
  .chip.on{border-color:transparent}
  input:focus,select:focus{box-shadow:var(--press),0 0 0 2px rgba(31,95,230,.30)}

  /* 記帳按鈕：橘底白字圓形 */
  #fab{width:84px;height:84px;padding:0;border-radius:50%!important;background:var(--orange-fill)!important;color:#fff!important;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;bottom:82px;
    box-shadow:6px 6px 16px rgba(40,80,170,.35),-5px -5px 12px var(--hi)!important;text-shadow:0 1px 1px rgba(10,30,90,.3)}
  #fab.hidden{display:none}
  #fab svg{filter:drop-shadow(0 1px 1px rgba(10,30,90,.3))}
  #fab:active{background:linear-gradient(180deg,#1a52dc,#1545bd)!important;box-shadow:inset 3px 3px 7px rgba(10,30,90,.35)!important}
  #app{padding-bottom:200px}

  /* 整體調亮 */
  :root{
    --bg:#f1f2f4; --card:#f5f6f8; --line:#d9dbdf; --rim:#cfd2d7;
    --hi:#ffffff; --lo:#d5d8dd; --muted:#8c9097; --accent-soft:#e6e8eb;
    --knob: linear-gradient(160deg,#ffffff 0%,#f0f1f3 55%,#e3e5e8 100%);
  }
  .grid3 div,.banner,.readonly,.pct,.btag,input,select,.bar,.share,.tabs button.on{background:var(--bg)}
  .chip.on{background:#e6e8eb}
  .erow+.erow,.hrow+.hrow{border-top-color:#e4e6e9}
  .tabs{background:var(--bg)}

  /* 藍色主題：進度條用藍→青漸層，跟參考圖一樣 */
  .bar>i{background:linear-gradient(90deg,#1f5fe6,#3fd6e0)}
  .bar.over>i{background:linear-gradient(180deg,#d77a6e,#b44c40)}

  /* 新增收入／新增預期支出：藍底白字 */
  #sAdd,#sAddInc{background:var(--orange-fill)!important;color:#fff!important;box-shadow:5px 5px 12px rgba(40,80,170,.30),-4px -4px 10px var(--hi)!important}
  #sAdd:active,#sAddInc:active{background:linear-gradient(180deg,#1a52dc,#1545bd)!important;box-shadow:inset 3px 3px 7px rgba(10,30,90,.35)!important}

  /* 凹陷變淺 */
  :root{ --press: inset 1.5px 1.5px 3px #dcdfe3, inset -1.5px -1.5px 3px #ffffff; }
  .bar,.share{box-shadow:inset 1px 1px 2px #dcdfe3, inset -1px -1px 2px #ffffff}
  input:focus,select:focus{box-shadow:var(--press),0 0 0 2px rgba(31,95,230,.25)}

  /* 歷史頁：拿掉總花費上方灰線，已儲蓄/投資跟總花費一樣大 */
  .htotal{border-top:0!important;margin-top:4px;padding-top:6px}
  .htotal.hsave{margin-top:0;padding-top:4px}

  .tabs button[data-tab=settings]{display:flex;align-items:center;justify-content:center}
  .tabs button svg{display:block}

  /* 記帳按鈕放大兩倍 */
  #fab{width:168px!important;height:168px!important;bottom:84px}
  #fab svg{width:100px;height:100px}
  #app{padding-bottom:290px}

  /* 發薪日提示泡泡（在齒輪上方） */
  .tips{position:fixed;z-index:15;bottom:calc(76px + env(safe-area-inset-bottom));right:max(10px, calc(50% - 240px + 10px));display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}
  .tip{position:relative;pointer-events:auto;
    background:var(--orange-fill);color:#fff;border:0;border-radius:14px;padding:10px 14px;font-size:13.5px;font-weight:400;line-height:1.5;text-align:left;
    box-shadow:0 8px 18px rgba(30,70,170,.35);cursor:pointer;font-family:inherit;animation:tipIn .3s ease-out}
  .tip.last::after{content:"";position:absolute;right:46px;bottom:-7px;border:8px solid transparent;border-bottom:0;border-top-color:#1a52dc}
  .tip.hidden{display:none}
  @keyframes tipIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* 設定頁內的提示：指向對應的輸入欄 */
  .itip{position:relative;display:block;width:max-content;max-width:calc(50% + 30px);margin:2px 0 12px calc(50% - 30px);
    background:var(--orange-fill);color:#fff;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:400;line-height:1.4;
    box-shadow:0 6px 14px rgba(30,70,170,.28);animation:tipIn .3s ease-out}
  .itip[hidden]{display:none}
  .itip.up::before{content:"";position:absolute;left:28px;top:-7px;border:8px solid transparent;border-top:0;border-bottom-color:#3d7bf5}
  .itip.down{margin:4px auto 12px}
  .itip.down::after{content:"";position:absolute;left:50%;margin-left:-8px;bottom:-7px;border:8px solid transparent;border-bottom:0;border-top-color:#1a52dc}

  /* 語音記帳 */
  #fab{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .voice{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(40,48,60,.28);pointer-events:none}
  .voice.hidden{display:none}
  .voice-card{background:var(--card);border-radius:24px;padding:26px 22px 22px;width:min(300px,82vw);text-align:center;box-shadow:0 14px 34px rgba(20,40,90,.25)}
  .mic{width:72px;height:72px;margin:0 auto 12px;border-radius:50%;background:var(--orange-fill);color:#fff;display:flex;align-items:center;justify-content:center}
  .voice[data-state=listening] .mic{animation:micPulse 1.2s ease-in-out infinite}
  @keyframes micPulse{0%{box-shadow:0 0 0 0 rgba(31,95,230,.45)}70%{box-shadow:0 0 0 18px rgba(31,95,230,0)}100%{box-shadow:0 0 0 0 rgba(31,95,230,0)}}
  .vt{font-weight:700;font-size:16px;margin-bottom:8px}
  .vtext{white-space:pre-line;color:var(--muted);font-size:14px;line-height:1.6;min-height:44px}
  .vhint{background:var(--bg);box-shadow:var(--press);border-radius:12px;padding:9px 12px;font-size:13px;color:var(--muted);line-height:1.5;margin:-4px 0 14px}
  .vhint b{color:var(--warn);font-weight:600}

  /* 語音時：其他畫面變暗、＋按鈕浮在最上層並有果凍感 */
  .voice{background:rgba(12,18,30,.62)!important;transition:background .2s}
  body.listening #fab{z-index:45}
  body.listening .tips{display:none}
  #fab{transition:transform .15s ease-out}
  #fab.squish{transform:translateX(-50%) scale(.9)}
  #fab.jelly{animation:jelly .9s ease-in-out infinite}
  #fab.bounce{animation:jellyOut .55s ease-out}
  @keyframes jelly{
    0%,100%{transform:translateX(-50%) scale(1,1)}
    25%{transform:translateX(-50%) scale(1.1,.9)}
    50%{transform:translateX(-50%) scale(.93,1.07)}
    75%{transform:translateX(-50%) scale(1.05,.95)}
  }
  @keyframes jellyOut{
    0%{transform:translateX(-50%) scale(.9)}
    35%{transform:translateX(-50%) scale(1.12,.88)}
    55%{transform:translateX(-50%) scale(.94,1.06)}
    75%{transform:translateX(-50%) scale(1.03,.97)}
    100%{transform:translateX(-50%) scale(1,1)}
  }

  /* 按住時：不用卡片，文字直接浮在壓暗的背景上 */
  .voice{align-items:flex-end!important;padding:0 24px calc(84px + 168px + 36px + env(safe-area-inset-bottom))}
  .voice-card{background:none!important;box-shadow:none!important;padding:0!important;width:auto!important;max-width:340px;color:#fff}
  .voice .mic{display:none}
  .voice .vt{color:#fff;font-size:22px;font-weight:700;letter-spacing:.5px;margin-bottom:12px;text-shadow:0 2px 10px rgba(0,0,0,.35)}
  .voice .vtext{color:rgba(255,255,255,.88);font-size:17px;line-height:1.7;text-shadow:0 1px 8px rgba(0,0,0,.35)}
  .voice[data-state=working] .vt::after{content:"";display:inline-block;width:6px}

  .voice{background:rgba(10,14,24,.80)!important;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}

  /* ================= 主題：清新綠（參考圖：米白底、綠色主色、扁平圓角、深色膠囊導覽列） ================= */
  :root{
    --bg:#f4f3e7; --card:#fbfbf5; --ink:#1e2320; --muted:#7b8075; --line:#e4e3d5; --rim:#e4e3d5;
    --green:#55a960; --green-dark:#2f7d3c; --green-soft:#e1edd2; --cream:#efeee1; --bubble:#eef2cf;
    --warn:#d2513f; --warn-soft:#f6e1dc;
    --orange:#2f7d3c; --orange-fill:#55a960;          /* 舊變數名稱沿用：重點金額、填色 */
    --raise:none; --raise-sm:none; --press:none; --knob:var(--cream);
  }
  html,body,header{background:var(--bg)}
  .card,.card.income{background:var(--card);border:1px solid var(--line)!important;box-shadow:none!important;border-radius:22px}
  h3{color:var(--muted)}
  .grid3 div{background:var(--cream)!important;box-shadow:none!important;border-radius:16px}
  .bar,.share{background:#e7ead9!important;box-shadow:none!important}
  .bar>i{background:var(--green)!important}
  .bar.over>i{background:var(--warn)!important}
  .pct,.btag{background:var(--green-soft)!important;color:var(--green-dark);box-shadow:none!important}
  .banner,.readonly{background:var(--bubble)!important;color:#4f5a2c;box-shadow:none!important}
  .vhint{background:var(--cream)!important;box-shadow:none!important}
  input,select{background:var(--cream)!important;box-shadow:none!important;border:1px solid transparent!important;border-radius:14px}
  input:focus,select:focus{box-shadow:0 0 0 2px rgba(85,169,96,.45)!important}
  /* 按鈕：扁平膠囊 */
  .btn,.chip,.del,.cycle-nav button{background:var(--cream)!important;box-shadow:none!important;color:var(--ink)}
  .btn{border-radius:999px;font-weight:700}
  .btn.primary,#sAdd,#sAddInc{background:var(--green)!important;color:#fff!important;box-shadow:none!important;text-shadow:none}
  .btn.primary:active,#sAdd:active,#sAddInc:active{background:#4a9655!important}
  .btn.danger{background:var(--warn-soft)!important;color:var(--warn)}
  .btn:active,.chip:active,.del:active,.cycle-nav button:active:not(:disabled){background:#e3e2d3!important}
  .chip{border-radius:999px}
  .chip.on{background:var(--ink)!important;color:#fff!important}
  .chip.on::before{color:var(--green)}
  .del{color:var(--muted)}
  .del.armed,.btn.danger.armed{background:var(--warn)!important;color:#fff!important}
  /* 頂部：今天日期改成深色膠囊（像參考圖選中的日期） */
  .date-badge{background:var(--ink)!important;color:#fff;box-shadow:none!important;text-shadow:none!important;border-radius:16px}
  .cycle-nav button{border-radius:50%}
  /* 重點金額：深綠 */
  .big,.amt,.daily .v,.grid3 b,.bremain b,.htotal .v,.pos,.alloc.res .v.pos{color:var(--green-dark)}
  .daily .v.neg,.grid3 b.neg,.htotal .v.neg,.bremain b.neg,.neg{color:var(--warn)}
  /* 底部導覽：深色浮動膠囊，選中的分頁是綠色膠囊 */
  .tabs{bottom:calc(12px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:456px;background:var(--ink)!important;
    border-radius:28px;padding:6px!important;gap:4px;box-shadow:0 8px 22px rgba(30,35,32,.22)!important}
  .tabs button{color:#b9bdb2;border-radius:999px;padding:11px 0}
  .tabs button.on{background:var(--green)!important;color:var(--ink)!important;box-shadow:none!important;font-weight:700}
  /* 記帳按鈕：綠色圓形、深色加號 */
  #fab{background:var(--green)!important;color:var(--ink)!important;box-shadow:0 10px 24px rgba(60,120,60,.30)!important;bottom:calc(92px + env(safe-area-inset-bottom))}
  #fab:active{background:#4a9655!important;box-shadow:0 6px 14px rgba(60,120,60,.30)!important}
  #fab svg{filter:none!important}
  /* 提示泡泡：淡黃綠對話泡泡、深色字（像參考圖的 GOOD JOB 泡泡） */
  .tip,.itip{background:var(--bubble)!important;color:var(--ink)!important;box-shadow:0 6px 16px rgba(30,35,32,.12)!important}
  .tip.last::after{border-top-color:var(--bubble)!important}
  .itip.up::before{border-bottom-color:var(--bubble)!important}
  .itip.down::after{border-top-color:var(--bubble)!important}
  .tips{bottom:calc(84px + env(safe-area-inset-bottom))}
  /* 語音聆聽：深綠黑背景 */
  .voice{background:rgba(26,32,28,.86)!important}
  .sheet{background:var(--card)!important}
  .erow+.erow,.hrow+.hrow{border-top-color:var(--line)}
  #toast{background:var(--ink)}

  /* 預期支出：兩欄小卡 */
  .bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .bgrid .card{margin:0;padding:14px 14px 10px;display:flex;flex-direction:column;min-width:0}
  .bgrid .card.open{grid-column:1 / -1}
  .bgrid .bname{font-size:clamp(20px,6vw,26px);font-weight:800;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bgrid .bar{margin:10px 0 8px;height:9px}
  .bgrid .bremain{text-align:left;font-size:13px;line-height:1.45}
  .bgrid .bremain b{font-size:14px}
  .bgrid .bdaily{text-align:right;margin-top:10px}
  .bgrid .bdaily .bl{font-size:11.5px;color:var(--muted);white-space:nowrap}
  .bgrid .bdaily .v{font-size:clamp(22px,7vw,30px);font-weight:800;line-height:1.15;color:var(--green-dark);white-space:nowrap;overflow:hidden}
  .bgrid .bdaily .v.neg{color:var(--warn)}
  .bgrid .btip{align-self:center;margin-top:10px;font-size:11px;color:var(--muted);background:var(--cream);border-radius:999px;padding:4px 10px;white-space:nowrap}
  .bgrid .elist{margin-top:10px}

  /* 收入卡片明細 */
  .icard{cursor:pointer;display:flex;flex-direction:column}
  .icard .btip{align-self:center;margin-top:10px;font-size:11px;color:var(--muted);background:var(--cream);border-radius:999px;padding:4px 10px}
  .ilist{margin-top:12px;border-top:1px dashed var(--line);padding-top:6px}
  .irow{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;font-size:14px}
  .irow+.irow{border-top:1px solid var(--line)}
  .irow small{color:var(--muted);font-size:11.5px;margin-left:4px}
  .irow.total{font-weight:800;font-size:15px}
  .irow.total span:last-child{color:var(--green-dark)}
  /* 預期支出明細：懸浮頁（背景模糊、內容可滑動） */
  .detail{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:24px 16px;
    background:rgba(30,35,32,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:dFade .2s ease-out}
  .detail.hidden{display:none}
  .dsheet{width:100%;max-width:440px;max-height:min(78vh,640px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    background:var(--card);border-radius:26px;padding:18px 18px 20px;box-shadow:0 18px 40px rgba(30,35,32,.25);animation:dPop .25s cubic-bezier(.2,.9,.3,1.2)}
  .dhead{display:flex;justify-content:space-between;align-items:center}
  .dname{font-size:26px;font-weight:800}
  .dclose{border:0;background:var(--cream);width:36px;height:36px;border-radius:50%;font-size:16px;color:var(--ink);cursor:pointer}
  .dsheet .bar{margin:12px 0 14px;height:10px}
  .dsum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .dsum div{background:var(--cream);border-radius:14px;padding:9px 11px}
  .dsum span{display:block;font-size:11.5px;color:var(--muted)}
  .dsum b{font-size:18px}
  .dsheet h4{margin:16px 2px 6px;font-size:13px;color:var(--muted);font-weight:600}
  body.detail-open{overflow:hidden}
  body.detail-open #fab, body.detail-open .tips{visibility:hidden}
  @keyframes dFade{from{opacity:0}to{opacity:1}}
  @keyframes dPop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}

  /* 總花費卡片：左大字、右 2×2 */
  .sumlay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.75fr);gap:12px;align-items:center}
  .sumL .big{font-size:clamp(24px,7.6vw,36px);line-height:1.15;white-space:nowrap;overflow:hidden}
  .sumR{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .sumR div{background:var(--cream);border-radius:16px;padding:9px 10px;min-width:0}
  .sumR .label{display:block;font-size:12px;white-space:nowrap}
  .sumR b{display:block;font-size:clamp(13px,4vw,16px);color:var(--green-dark);white-space:nowrap;overflow:hidden}
  .sumR b.neg{color:var(--warn)}

  /* 儲蓄與投資頁：每期一張摘要卡，點開看完整內容 */
  .hcard{cursor:pointer;display:flex;flex-direction:column}
  .hcard .htotal{margin:0;padding:8px 0}
  .hcard .htotal+.htotal{border-top:1px solid var(--line)!important}
  .hcard .htotal .v{color:var(--green-dark)}
  .hcard .htotal .v.neg{color:var(--warn)}
  .hcard .btip{align-self:center;margin-top:8px;font-size:11px;color:var(--muted);background:var(--cream);border-radius:999px;padding:4px 10px}
  .hsheet{max-width:460px;max-height:min(84vh,760px);background:var(--bg)!important}
  .hsub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .hpage{margin-top:12px}
  .hpage .card{cursor:default;pointer-events:none}
  .hpage h3{margin-top:14px}
  .hcard .sub{font-size:12.5px;color:var(--muted)}

  /* 頂部：問候 + 日期條（參考圖） */
  header{padding:14px 16px 6px}
  .hello{font-size:26px;font-weight:500;letter-spacing:.2px;margin:2px 2px 10px}
  .hello b{font-weight:800}
  .days{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 0 6px;scroll-behavior:smooth}
  .days::-webkit-scrollbar{display:none}
  .day{flex:0 0 auto;width:40px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 7px;border-radius:999px}
  .day .wk{font-size:11px;color:var(--muted);font-weight:600}
  .day .dn{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink)}
  .day.used .dn{background:var(--green-soft)}
  .day.future .dn{color:#a9ad9f}
  .day.today{background:var(--ink)}
  .day.today .wk{color:#fff}
  .day.today .dn{color:#fff}
  /* 總花費卡片頂端：期別與倒數 */
  .sumhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
  .sumhead b{font-size:17px}
  .sumhead span{font-size:13px;color:var(--muted)}
  /* 首次開啟：輸入名字的完整頁面 */
  .welcome{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:28px}
  .welcome.hidden{display:none}
  .wbox{width:100%;max-width:360px;text-align:center}
  .wlogo{width:76px;height:76px;margin:0 auto 22px;border-radius:24px;background:var(--green);color:var(--ink);display:flex;align-items:center;justify-content:center}
  .wbox h1{font-size:28px;line-height:1.3;margin:0 0 10px}
  .wbox p{color:var(--muted);font-size:15px;margin:0 0 22px}
  .wbox input{text-align:center;font-size:18px;padding:14px;margin-bottom:14px}
  .wbox .btn{width:100%;padding:14px;font-size:16px}
  .wbox .hint{margin-top:12px}
  .cycle-nav[hidden]{display:none!important}

  /* ＋按鈕：平常每 10 秒輕輕果凍跳一下（約 0.9 秒），其餘時間靜止 */
  #fab{animation:fabIdle 10s ease-in-out 2s infinite}
  #fab.squish{animation:none}
  #fab.jelly{animation:jelly .9s ease-in-out infinite}
  #fab.bounce{animation:jellyOut .55s ease-out}
  @keyframes fabIdle{
    0%,90%,100%{transform:translateX(-50%) scale(1,1)}
    91.5%{transform:translateX(-50%) translateY(-6px) scale(.94,1.07)}
    93%{transform:translateX(-50%) scale(1.09,.91)}
    94.5%{transform:translateX(-50%) translateY(-2px) scale(.96,1.04)}
    96%{transform:translateX(-50%) scale(1.03,.97)}
    97.5%{transform:translateX(-50%) scale(.99,1.01)}
  }
  @media (prefers-reduced-motion: reduce){ #fab{animation:none} }

  /* ＋按鈕：拿掉綠色光暈，只留淡淡的中性陰影 */
  #fab{box-shadow:0 5px 12px rgba(30,35,32,.18)!important}
  #fab:active{box-shadow:0 2px 6px rgba(30,35,32,.18)!important}

  /* ＋按鈕：完全沒有光暈；尺寸縮成原本的 80%（168 → 134px） */
  #fab::after,#fab::before{content:none!important;display:none!important}
  #fab{width:134px!important;height:134px!important;box-shadow:0 4px 10px rgba(30,35,32,.16)!important}
  #fab:active{box-shadow:0 2px 5px rgba(30,35,32,.16)!important}
  #fab svg{width:80px;height:80px}
  #app{padding-bottom:250px}

  /* 日期條：可左右滑動；今天用綠框 + 白色呼吸光 */
  .days{position:relative;touch-action:pan-x;scroll-snap-type:x proximity;padding:8px 6px 10px;margin:0 -6px;cursor:grab}
  .day{scroll-snap-align:center}
  .day.out .dn,.day.out .wk{opacity:.45}
  .day.today{background:var(--card)!important;box-shadow:inset 0 0 0 2.5px var(--green);animation:todayGlow 2.6s ease-in-out infinite}
  .day.today .wk{color:var(--green-dark)!important}
  .day.today .dn{color:var(--ink)!important}
  @keyframes todayGlow{
    0%,100%{box-shadow:inset 0 0 0 2.5px var(--green), 0 0 0 0 rgba(255,255,255,0)}
    50%{box-shadow:inset 0 0 0 2.5px var(--green), 0 0 10px 5px rgba(255,255,255,.95)}
  }
  @media (prefers-reduced-motion: reduce){ .day.today{animation:none} }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hello">嗨，<b id="uName"></b>！</div>
    <div class="days" id="dayStrip"></div>
    <div class="cycle-nav" hidden>
      <button id="prevC" aria-label="上一期">‹</button>
      <div class="cycle-mid"><div class="date-badge" id="cycleDate"></div><div class="cycle-title"><div class="t" id="cycleLabel"></div><div class="s" id="cycleSub"></div></div></div>
      <button id="nextC" aria-label="下一期">›</button>
    </div>
  </header>
  <main id="view"></main>
  <button id="fab" aria-label="記一筆支出" title="記一筆支出"><svg viewBox="0 0 48 48" width="50" height="50" aria-hidden="true"><path d="M24 6v36M6 24h36" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/></svg></button>
  <nav class="tabs">
    <button data-tab="budget" class="on">收入與預期支出</button>
    <button data-tab="history">儲蓄與投資</button>
    <button data-tab="settings" aria-label="設定" title="設定"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" stroke="currentColor" stroke-width="1" stroke-linejoin="round" d="M9.55 4.07 L9.81 1.22 L14.19 1.22 L14.45 4.07 L15.87 4.66 L18.08 2.83 L21.17 5.92 L19.34 8.13 L19.93 9.55 L22.78 9.81 L22.78 14.19 L19.93 14.45 L19.34 15.87 L21.17 18.08 L18.08 21.17 L15.87 19.34 L14.45 19.93 L14.19 22.78 L9.81 22.78 L9.55 19.93 L8.13 19.34 L5.92 21.17 L2.83 18.08 L4.66 15.87 L4.07 14.45 L1.22 14.19 L1.22 9.81 L4.07 9.55 L4.66 8.13 L2.83 5.92 L5.92 2.83 L8.13 4.66 Z M7.6 12 a4.4 4.4 0 1 0 8.8 0 a4.4 4.4 0 1 0 -8.8 0 Z"/></svg></button>
  </nav>
</div>

<div class="mask hidden" id="mask">
  <form class="sheet" id="sheet" autocomplete="off">
    <h2>記一筆支出</h2>
    <div class="vhint" id="fVoice" hidden></div>
    <div class="field"><label>金額</label><input class="amount-in" id="fAmt" type="text" inputmode="decimal" enterkeyhint="done" placeholder="0"></div>
    <div class="field"><label>扣在哪筆預期支出</label><div class="chips" id="fChips"></div></div>
    <div class="field"><label>日期</label><input id="fDate" type="date"></div>
    <div class="field"><label>備註（可不填）</label><input id="fNote" type="text" maxlength="40" placeholder="例如：午餐便當"></div>
    <div class="row"><button type="button" class="btn ghost" id="fCancel">取消</button><button type="submit" class="btn primary">儲存</button></div>
  </form>
</div>
<div class="tips"><button id="newCycleTip" class="tip hidden" type="button">尚未填寫本期收入！<br>點這裡填寫</button><button id="budgetTip" class="tip hidden" type="button">尚未填寫預期支出！<br>點這裡填寫</button></div>
<div class="voice hidden" id="voiceOverlay"><div class="voice-card"><div class="mic"><svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></div><div class="vt" id="voiceTitle">聆聽中…</div><div class="vtext" id="voiceText"></div></div></div>
<div class="mask hidden" id="voiceType"><form class="sheet" id="vtForm" autocomplete="off">
    <h2>模擬語音輸入</h2>
    <div class="vhint">預覽版無法使用麥克風，請把要說的話打出來。格式：「金額 項目 備註」，例如「120 餐飲 午餐便當」或「兩千五 房租」。裝成 App 後就是真的用說的。</div>
    <div class="field"><input id="vtIn" type="text" placeholder="120 餐飲 午餐便當"></div>
    <div class="row"><button type="button" class="btn ghost" id="vtCancel">取消</button><button type="submit" class="btn primary">辨識</button></div>
  </form></div>
<div class="detail hidden" id="hdetail"><div class="dsheet hsheet" id="hBody"></div></div>
<div class="detail hidden" id="detail"><div class="dsheet" id="dBody"></div></div>
<div class="welcome hidden" id="welcome"><form class="wbox" id="wForm" autocomplete="off">
    <div class="wlogo"><svg viewBox="0 0 48 48" width="40" height="40" aria-hidden="true"><path d="M24 10v28M10 24h28" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg></div>
    <h1>歡迎使用<br>發薪日預算</h1>
    <p>先讓我認識你，要怎麼稱呼你呢？</p>
    <input id="wName" type="text" maxlength="12" placeholder="輸入你的名字或暱稱">
    <button type="submit" class="btn primary" id="wGo">開始使用</button>
    <div class="hint">之後可以在「設定」修改</div>
  </form></div>
<div id="toast"></div>

<script>
(function(){
  "use strict";
  const KEY = 'payday-budget-v1';
  const CARRY = 'carry';
  const COLORS = ['#55a960','#e5c04a','#7fb8d6','#e88d6b','#a48fd6','#6fc3a8','#d6a86f','#9aa4a0','#c97fa8'];

  // ---------- 儲存 ----------
  let memCopy = null;
  function load(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return memCopy ? JSON.parse(memCopy) : null; } }
  function save(){ const j = JSON.stringify(S); memCopy = j; try{ localStorage.setItem(KEY, j); }catch(e){} }

  // ---------- 日期工具 ----------
  const pad = n => String(n).padStart(2,'0');
  const fmt = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
  const dim = (y,m) => new Date(y, m+1, 0).getDate();
  const paydayOf = (y,m,day) => new Date(y, m, Math.min(day, dim(y,m)));
  function nextPaydayAfter(s, day){ // 嚴格大於 s 的下一個發薪日
    const d = parse(s); const c = paydayOf(d.getFullYear(), d.getMonth(), day);
    if (c > d) return fmt(c);
    const n = new Date(d.getFullYear(), d.getMonth()+1, 1);
    return fmt(paydayOf(n.getFullYear(), n.getMonth(), day));
  }
  function lastPaydayOnOrBefore(s, day){
    const d = parse(s); const c = paydayOf(d.getFullYear(), d.getMonth(), day);
    if (c <= d) return fmt(c);
    const p = new Date(d.getFullYear(), d.getMonth()-1, 1);
    return fmt(paydayOf(p.getFullYear(), p.getMonth(), day));
  }
  const diffDays = (a,b) => Math.round((parse(b) - parse(a)) / 86400000);
  const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return fmt(d); };
  const md = s => { const d = parse(s); return (d.getMonth()+1)+'/'+d.getDate(); };
  const periodName = c => (parse(c.start).getMonth()+1) + '月期';
  const range = c => md(c.start) + '－' + md(addDays(c.end,-1));
  const realToday = () => fmt(new Date());
  const today = () => realToday();

  // ---------- 其他工具 ----------
  const uid = () => Math.random().toString(36).slice(2,10);
  const money = n => (n < 0 ? '-' : '') + '$' + Math.round(Math.abs(n)).toLocaleString('zh-TW');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  // 把輸入轉成數字：支援全形數字、千分位逗號、全形負號
  function toNum(v){
    const t = String(v||'').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .replace(/[－−—]/g,'-').replace(/[．。]/g,'.').replace(/[,，\s$＄]/g,'');
    const n = parseFloat(t); return isFinite(n) ? n : 0;
  }
  const sumExp = list => list.reduce((a,e) => a + e.amount, 0);
  const spentOf = (c, bid) => sumExp(c.expenses.filter(e => e.budgetId === bid));
  const totalBudget = c => c.budgets.reduce((a,b) => a + b.amount, 0);
  // 名稱含「儲蓄」或「投資」的預算，算作儲蓄/投資
  const isSaving = b => /儲蓄|投資/.test(b.name);
  const savedOf = c => c.budgets.filter(isSaving).reduce((a,b) => a + spentOf(c, b.id), 0);
  // 有填金額、或已經有花費的項目才顯示
  const shown = c => c.budgets.filter(b => b.amount > 0 || spentOf(c, b.id) > 0);
  const incomeTotal = c => (c.carry||0) + c.incomes.reduce((a,x) => a + x.amount, 0);
  let toastT;
  function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

  // ---------- 資料初始化 ----------
  let S = load();
  if (!S){
    const t = realToday(), day = 5;
    const start = lastPaydayOnOrBefore(t, day);
    S = { payday: day, fakeToday: null, firstRun: true, cycles: [{
      start, end: nextPaydayAfter(start, day),
      budgets: [
        ...['餐飲','交通','娛樂','寵物用品','機車','房租','貸款','儲蓄','投資'].map(name => ({ id: uid(), name, amount: 0 }))
      ],
      carry: 0, carryAuto: 0,
      incomes: [{ id: uid(), name: '薪資', amount: 0 }],
      expenses: []
    }]};
    save();
  }
  // 舊版資料轉換：上月結餘從「預算」搬到「收入」
  S.cycles.forEach(c => {
    if (!c.incomes) c.incomes = [];
    const old = c.budgets.find(b => b.carry);
    if (old){
      if (c.carry === undefined){ c.carry = old.amount; c.carryAuto = old.amount; }
      if (c.expenses.some(e => e.budgetId === old.id)){ delete old.carry; old.id = 'old-carry'; c.expenses.forEach(e => { if (e.budgetId === CARRY) e.budgetId = 'old-carry'; }); old.name = '上月結餘（舊）'; }
      else c.budgets = c.budgets.filter(b => b !== old);
    }
    if (c.carry === undefined){ c.carry = 0; c.carryAuto = 0; }
  });
  save();

  // 過了發薪日 → 自動開新的一期，把上一期剩下的錢全部歸入「上月結餘」
  function rollover(){
    let cur = S.cycles[S.cycles.length-1], changed = false;
    const t = today();
    while (t >= cur.end){
      const left = incomeTotal(cur) - sumExp(cur.expenses);   // 收入合計（含上月結餘）－ 總花費
      const budgets = cur.budgets.map(b => ({ id: b.id, name: b.name, amount: b.amount }));
      const start = cur.end;
      const incomes = (cur.incomes||[]).map(x => ({ id: x.id, name: x.name, amount: 0 }));   // 收入只留名稱，金額每期重填
      cur = { start, end: nextPaydayAfter(start, S.payday), carry: left, carryAuto: left, budgets, incomes, expenses: [] };
      S.cycles.push(cur); changed = true;
    }
    if (changed) save();
    return changed;
  }

  // ---------- 畫面狀態 ----------
  let tab = 'budget';
  let viewIdx = S.cycles.length - 1;
  let incomeOpen = false;    // 收入卡片是否展開
  let detailId = null;       // 正在看哪張預期支出卡片的明細（懸浮頁）
  let armed = null;          // 兩段式刪除用
  const curCycle = () => S.cycles[S.cycles.length-1];
  const isCurrent = () => viewIdx === S.cycles.length - 1;
  const viewCycle = () => S.cycles[viewIdx];
  function daysLeft(c){ const t = today(); const from = t < c.start ? c.start : t; return Math.max(1, diffDays(from, c.end)); }

  const WK = ['日','一','二','三','四','五','六'];
  function renderHeader(){
    const c = viewCycle();
    document.getElementById('uName').textContent = S.userName || '你';
    // 日期條：本期每一天；今天是深色膠囊，有記帳的日子是淡綠圓圈
    const cur = curCycle(), t = today(), used = new Set(cur.expenses.map(e => e.date));
    // 範圍：本期開始前 14 天 ～ 下次發薪日後 2 週（至少到今天後 3 週），可左右滑動
    S.cycles.forEach(cy => cy.expenses.forEach(e => used.add(e.date)));
    let d = addDays(cur.start, -14), html = '';
    const last = [addDays(cur.end, 13), addDays(t, 21)].sort().pop();
    while (d <= last){
      const dt = parse(d), isT = d === t, out = d < cur.start || d >= cur.end;
      html += '<div class="day'+(isT?' today':'')+(used.has(d)&&!isT?' used':'')+(d > t?' future':'')+(out?' out':'')+'" data-day="'+d+'">'
        + '<span class="wk">'+(dt.getDate() === 1 ? (dt.getMonth()+1)+'月' : WK[dt.getDay()])+'</span><span class="dn">'+dt.getDate()+'</span></div>';
      d = addDays(d, 1);
    }
    const strip = document.getElementById('dayStrip');
    if (strip.dataset.key !== cur.start + t + used.size){
      strip.innerHTML = html; strip.dataset.key = cur.start + t + used.size;
      const td = strip.querySelector('.today');
      if (td){ strip.style.scrollBehavior = 'auto'; strip.scrollLeft = td.offsetLeft - strip.clientWidth / 2 + td.offsetWidth / 2; strip.style.scrollBehavior = ''; }
    }
    document.getElementById('cycleDate').textContent = md(today());   // 顯示今天日期
    document.getElementById('cycleLabel').textContent = periodName(c);
    document.getElementById('cycleSub').innerHTML = isCurrent()
      ? '<span>距離下次發薪日（' + md(c.end) + '）</span><span>還有 ' + daysLeft(c) + ' 天</span>'
      : '<span>已結束</span><span>（' + range(c) + '）</span>';
    document.getElementById('prevC').disabled = viewIdx === 0 || tab === 'settings';
    document.getElementById('nextC').disabled = isCurrent();
    document.getElementById('fab').classList.toggle('hidden', !isCurrent() || tab === 'settings' || tab === 'history');
  }

  function expenseRow(c, e, opts){
    const b = c.budgets.find(x => x.id === e.budgetId);
    const pct = b && b.amount > 0 ? (e.amount / b.amount * 100) : null;
    const pctTxt = pct === null ? '—' : (pct >= 10 ? pct.toFixed(0) : pct.toFixed(1)) + '%';
    const delBtn = isCurrent() ? '<button class="del'+(armed===e.id?' armed':'')+'" data-del="'+e.id+'">'+(armed===e.id?'確定刪除':'刪除')+'</button>' : '';
    return '<div class="erow"><div class="l"><div class="n">'
      + (opts.showBudget && b ? '<span class="btag">'+esc(b.name)+'</span>' : '')
      + esc(e.note || '（無備註）') + '</div><div class="d">' + md(e.date) + '</div></div>'
      + '<div class="r">' + money(e.amount) + '<span class="pct" title="佔該預期支出比例">佔'+pctTxt+'</span>' + delBtn + '</div></div>';
  }
  const sortExp = list => list.slice().sort((a,b) => (b.date.localeCompare(a.date)) || (b.ts - a.ts));

  function renderBudget(){
    const c = viewCycle(), dl = daysLeft(c), cur = isCurrent();
    let h = '';
    if (S.firstRun && cur) h += '<div class="banner">已備好常用項目，到「設定」填金額就會顯示在這裡。</div>';
    if (!cur) h += '<div class="readonly">這是已結束的期別，只能查看。</div>';
    h += summaryCard(c);
    {
      const inc = incomeTotal(c), sp = sumExp(c.expenses), rem = inc - sp;
      const ratio = inc > 0 ? Math.min(1, Math.max(0, sp / inc)) : (sp > 0 ? 1 : 0);
      const over = rem < 0;
      let rows = '<div class="irow"><span>上月結餘'+(c.carry !== c.carryAuto ? '<small>（已手動修改）</small>' : '<small>（自動帶入）</small>')+'</span><span class="'+((c.carry||0)<0?'neg':'')+'">'+money(c.carry||0)+'</span></div>';
      c.incomes.forEach(x => { rows += '<div class="irow"><span>'+esc(x.name)+'</span><span>'+money(x.amount)+'</span></div>'; });
      rows += '<div class="irow total"><span>收入合計</span><span>'+money(inc)+'</span></div>';
      h += '<div class="card income icard'+(incomeOpen?' open':'')+'" data-inc="1">'
        + '<div class="bhead" style="align-items:center"><div class="bname">'+periodName(c)+'可用預算</div>'
        + '<div class="amt" style="font-size:22px;font-weight:800">'+money(inc)+'</div></div>'
        + '<div class="bar'+(over?' over':'')+'"><i style="width:'+(ratio*100).toFixed(1)+'%"></i></div>'
        + (inc === 0 && cur ? '<div class="hint">尚未填寫收入，請到「設定」填寫。</div>' : '')
        + (incomeOpen ? '<div class="ilist">'+rows+'</div>' : '')
        + '<div class="btip">'+(incomeOpen?'點卡片收合明細':'點卡片可看明細')+'</div>'
        + '</div><h3>'+periodName(c)+'預期支出</h3>';
    }
    if (!shown(c).length) h += '<div class="card"><div class="empty">尚無項目，請到「設定」填金額。</div></div>';
    if (shown(c).length) h += '<div class="bgrid">';
    shown(c).forEach(b => {
      const spent = spentOf(c, b.id), remain = b.amount - spent;
      const ratio = b.amount > 0 ? Math.min(1, spent / b.amount) : (spent > 0 ? 1 : 0);
      const over = remain < 0;
      const daily = remain / dl;
      const list = sortExp(c.expenses.filter(e => e.budgetId === b.id));
      // 兩欄小卡：名稱 → 進度條 → 剩餘 → 每日可用（大字靠右）→ 底部提示；點開時整張卡片撐滿一列顯示明細
      h += '<div class="card bcard" data-card="'+b.id+'">'
        + '<div class="bname">'+esc(b.name)+'</div>'
        + '<div class="bar'+(over?' over':'')+'"><i style="width:'+(ratio*100).toFixed(1)+'%"></i></div>'
        + '<div class="bremain">剩 <b'+(remain<0?' class="neg"':'')+'>'+money(remain)+'</b> / '+money(b.amount)+'</div>'
        + '<div class="bdaily">'
        + (cur ? (over ? '<div class="bl">已超支</div><div class="v neg">'+money(-remain)+'</div>'
                       : '<div class="bl">每日可用（剩 '+dl+' 天）</div><div class="v">'+money(daily)+'</div>')
               : '<div class="bl">花了 '+money(spent)+'</div><div class="v'+(over?' neg':'')+'">'+(over?'超支 '+money(-remain):'結餘 '+money(remain))+'</div>')
        + '</div>';
      h += '<div class="btip">點卡片可看花費明細</div></div>';
    });
    if (shown(c).length) h += '</div>';
    return h;
  }

  // 金額太長放不下時，自動縮小字體直到完整顯示
  function fitText(){
    document.querySelectorAll('.sumL .big, .sumR b, .bgrid .bdaily .v').forEach(el => {
      el.style.fontSize = '';
      let size = parseFloat(getComputedStyle(el).fontSize), guard = 0;
      while (el.scrollWidth > el.clientWidth + 1 && size > 11 && guard++ < 40){ size -= 1; el.style.fontSize = size + 'px'; }
    });
  }
  window.addEventListener('resize', () => fitText());

  function renderDetail(){
    const box = document.getElementById('detail');
    const c = viewCycle(), b = detailId && c.budgets.find(x => x.id === detailId);
    if (!b){ box.classList.add('hidden'); document.body.classList.remove('detail-open'); return; }
    const spent = spentOf(c, b.id), remain = b.amount - spent, dl = daysLeft(c), over = remain < 0;
    const ratio = b.amount > 0 ? Math.min(1, spent / b.amount) : (spent > 0 ? 1 : 0);
    const list = sortExp(c.expenses.filter(e => e.budgetId === b.id));
    document.getElementById('dBody').innerHTML =
        '<div class="dhead"><div class="dname">'+esc(b.name)+'</div><button type="button" class="dclose" id="dClose" aria-label="關閉">✕</button></div>'
      + '<div class="bar'+(over?' over':'')+'"><i style="width:'+(ratio*100).toFixed(1)+'%"></i></div>'
      + '<div class="dsum"><div><span>預期支出</span><b>'+money(b.amount)+'</b></div><div><span>已花</span><b>'+money(spent)+'</b></div>'
      + '<div><span>'+(over?'已超支':'剩餘')+'</span><b class="'+(over?'neg':'pos')+'">'+money(Math.abs(remain))+'</b></div>'
      + (isCurrent() && !over ? '<div><span>每日可用（剩 '+dl+' 天）</span><b class="pos">'+money(remain/dl)+'</b></div>' : '')
      + '</div>'
      + '<h4>花費明細（'+list.length+' 筆）</h4>'
      + '<div class="dlist">' + (list.length ? list.map(e => expenseRow(c, e, {showBudget:false})).join('') : '<div class="empty">這個項目還沒有花費</div>') + '</div>';
    box.classList.remove('hidden'); document.body.classList.add('detail-open');
  }
  function closeDetail(){ detailId = null; armed = null; renderDetail(); }

  function summaryCard(c){
    const tb = totalBudget(c), ts = sumExp(c.expenses), dl = daysLeft(c);
    // 左：總花費、已儲蓄/投資（大字）；右：2×2 小格
    let h = '<div class="card"><div class="sumhead"><b>'+periodName(c)+'</b><span>'
      + (isCurrent() ? '距離下次發薪日（'+md(c.end)+'）還有 '+daysLeft(c)+' 天' : '已結束（'+range(c)+'）') + '</span></div>'
      + '<div class="sumlay">'
      + '<div class="sumL"><div class="label">'+periodName(c)+'總花費</div><div class="big">'+money(ts)+'</div>'
      + '<div class="label" style="margin-top:6px">已儲蓄/投資</div><div class="big">'+money(savedOf(c))+'</div></div>'
      + '<div class="sumR">'
      + '<div><span class="label">總可用預算</span><b>'+money(incomeTotal(c))+'</b></div>'
      + '<div><span class="label">總預期支出</span><b>'+money(tb)+'</b></div>'
      + '<div><span class="label">預算剩餘</span><b'+(incomeTotal(c)-ts<0?' class="neg"':'')+'>'+money(incomeTotal(c)-ts)+'</b></div>'
      + '<div><span class="label">'+(isCurrent()?'每日可用':'支出筆數')+'</span><b>'+(isCurrent()?money((incomeTotal(c)-ts)/dl):c.expenses.length+' 筆')+'</b></div>'
      + '</div></div>';
    if (ts > 0){
      h += '<div class="share">';
      c.budgets.forEach((b,i) => { const s = spentOf(c,b.id); if (s>0) h += '<i style="width:'+(s/ts*100)+'%;background:'+COLORS[i%COLORS.length]+'"></i>'; });
      h += '</div><div class="legend">';
      c.budgets.forEach((b,i) => { const s = spentOf(c,b.id); if (s>0) h += '<span style="--c:'+COLORS[i%COLORS.length]+'">'+esc(b.name)+' '+money(s)+'（'+(s/ts*100).toFixed(0)+'%）</span>'; });
      h += '</div>';
    }
    h += '</div>';
    return h;
  }

  function renderHistory(){
    const past = S.cycles.map((c, i) => [c, i]).slice(0, -1).reverse();
    if (!past.length) return '<div class="card"><div class="empty">過了下次發薪日，這裡會出現上一期紀錄。</div></div>';
    return past.map(([c, idx]) => {
      const ts = sumExp(c.expenses), tb = totalBudget(c);
      return '<h3>'+parse(c.start).getFullYear()+'年 '+periodName(c)+'（'+range(c)+'）</h3>'
        + '<div class="card hcard" data-hist="'+idx+'">'
        + '<div class="htotal"><span>可用預算</span><span class="v">'+money(incomeTotal(c))+'</span></div>'
        + '<div class="htotal"><span>'+periodName(c)+'總花費</span><span class="v'+(ts>tb?' neg':'')+'">'+money(ts)+' <span class="sub" style="font-weight:400">/ 預期 '+money(tb)+'</span></span></div>'
        + '<div class="htotal"><span>已儲蓄/投資</span><span class="v pos">'+money(savedOf(c))+'</span></div>'
        + '<div class="btip">點卡片看完整內容</div></div>';
    }).join('');
  }

  // 歷史期別：懸浮頁顯示那一期完整的「收入與預期支出」內容（唯讀）
  let histIdx = null;
  function renderHistDetail(){
    const box = document.getElementById('hdetail');
    const c = histIdx === null ? null : S.cycles[histIdx];
    if (!c || tab !== 'history'){ histIdx = null; box.classList.add('hidden'); if (!detailId) document.body.classList.remove('detail-open'); return; }
    const keepIdx = viewIdx, keepInc = incomeOpen;
    viewIdx = histIdx; incomeOpen = true;          // 借用首頁的畫法：切到那一期、收入明細展開
    let body = renderBudget();
    viewIdx = keepIdx; incomeOpen = keepInc;
    body = body.replace(/<div class="readonly">[^<]*<\/div>/, '').replace(/<div class="btip">[^<]*<\/div>/g, '');
    document.getElementById('hBody').innerHTML =
        '<div class="dhead"><div><div class="dname">'+periodName(c)+'</div><div class="hsub">'+parse(c.start).getFullYear()+'年 '+range(c)+'・已結束</div></div>'
      + '<button type="button" class="dclose" id="hClose" aria-label="關閉">✕</button></div>'
      + '<div class="hpage">'+body+'</div>';
    box.classList.remove('hidden'); document.body.classList.add('detail-open');
    fitText();
  }

  function allocHTML(c){
    const inc = incomeTotal(c);
    const bud = totalBudget(c);
    const r = inc - bud;
    return '<div class="alloc"><span>收入合計（含上月結餘）</span><span>'+money(inc)+'</span></div>'
      + '<div class="alloc"><span>預期支出合計</span><span>'+money(bud)+'</span></div>'
      + '<div class="alloc res"><span>預期支出分配狀況</span><span class="v '+(r<0?'neg':'pos')+'">'+(r>0?'+':'')+money(r)+'</span></div>'
      + '<div class="hint">'+(r<0?'超出收入 '+money(-r):r>0?'尚有 '+money(r)+' 未分配':'剛好分配完')+'</div>';
  }
  function updateTip(incomes, budgets){
    const c = curCycle();
    const list = incomes || c.incomes.map(x => x.amount);
    const need = !list.some(v => v > 0);   // 只要收入是空的就顯示
    const blist = budgets || c.budgets.map(b => b.amount);
    const needB = !blist.some(v => v > 0); // 只要預期支出全是空的就顯示
    const t1 = document.getElementById('newCycleTip'), t2 = document.getElementById('budgetTip');
    const inSet = tab === 'settings';
    t1.classList.toggle('hidden', !need || inSet); t2.classList.toggle('hidden', !needB || inSet);
    const i1 = document.getElementById('inTipInc'), i2 = document.getElementById('inTipBud');
    if (i1) i1.hidden = !need; if (i2) i2.hidden = !needB;
    t1.classList.toggle('last', need && !(needB && !inSet)); t2.classList.toggle('last', needB);
  }
  document.getElementById('budgetTip').addEventListener('click', () => {
    tab = 'settings'; armed = null; render();
    const f = document.querySelector('[data-am]');
    if (f){ f.scrollIntoView({block:'center'}); f.focus({preventScroll:true}); }
  });
  document.getElementById('newCycleTip').addEventListener('click', () => {
    tab = 'settings'; armed = null; render(); window.scrollTo(0,0);
    const f = document.querySelector('[data-iam]'); if (f) f.focus();
  });
  function liveAlloc(){
    const c = curCycle(), el = document.getElementById('allocBox'); if (!el) return;
    const ci = document.getElementById('sCarry');
    const tmp = { carry: ci ? Math.round(toNum(ci.value)||0) : c.carry, incomes: c.incomes.map(x => { const i = document.querySelector('[data-iam="'+x.id+'"]'); return { amount: i ? Math.max(0, toNum(i.value)||0) : x.amount }; }),
                  budgets: c.budgets.map(b => { const i = document.querySelector('[data-am="'+b.id+'"]'); return { amount: i ? Math.max(0, toNum(i.value)||0) : b.amount }; }) };
    el.innerHTML = allocHTML(tmp);
    updateTip(tmp.incomes.map(x => x.amount), tmp.budgets.map(b => b.amount));
  }

  function renderSettings(){
    const c = curCycle();
    let opts = ''; for (let d=1; d<=31; d++) opts += '<option value="'+d+'"'+(d===S.payday?' selected':'')+'>每月 '+d+' 號</option>';
    let h = '<h3>你的名字</h3><div class="card"><input id="sName" type="text" maxlength="12" placeholder="名字或暱稱" value="'+esc(S.userName||'')+'"></div>'
      + '<h3>發薪日</h3><div class="card"><select id="sPay">'+opts+'</select>'
      + '<div class="hint">沒有該日的月份以月底計。修改後，本期延到新發薪日結束。</div></div>';
    h += '<h3>'+periodName(c)+'收入</h3><div class="card">';
    h += '<div class="brow"><input class="nm" value="上月結餘" disabled>'
      + '<input class="am" id="sCarry" type="text" inputmode="numeric" placeholder="0" value="'+(c.carry||'')+'"><span style="width:44px"></span></div>';
    h += '<div class="hint" style="margin:-2px 0 10px">自動帶入上期剩餘的錢，可手動修改。'
      + (c.carry !== c.carryAuto ? ' <a href="#" id="sCarryReset" style="color:var(--accent)">恢復自動（'+money(c.carryAuto)+'）</a>' : '') + '</div>';
    const noInc = !c.incomes.some(x => x.amount > 0), noBud = !c.budgets.some(b => b.amount > 0);
    c.incomes.forEach((x, i) => {
      h += '<div class="brow"><input class="nm" data-inm="'+x.id+'" value="'+esc(x.name)+'" maxlength="12">'
        + '<input class="am" data-iam="'+x.id+'" type="text" inputmode="numeric" placeholder="0" value="'+(x.amount||'')+'">'
        + '<button class="del'+(armed==='i'+x.id?' armed':'')+'" data-idel="'+x.id+'">'+(armed==='i'+x.id?'確定':'刪除')+'</button></div>';
      if (i === 0) h += '<div class="itip up" id="inTipInc"'+(noInc?'':' hidden')+'>尚未填寫本期收入！<br>在上面填入金額</div>';
    });
    if (!c.incomes.length) h += '<div class="itip down" id="inTipInc"'+(noInc?'':' hidden')+'>尚未填寫本期收入！按下面新增一筆</div>';
    h += '<button class="btn ghost" id="sAddInc" style="width:100%;margin-top:4px">＋ 新增一筆收入</button>'
      + '<div class="hint">下一期只保留名稱，金額需重填。</div></div>';
    h += '<h3>'+periodName(c)+'預期支出</h3><div class="card">';
    c.budgets.forEach(b => {
        h += '<div class="brow"><input class="nm" data-nm="'+b.id+'" value="'+esc(b.name)+'" maxlength="12">'
          + '<input class="am" data-am="'+b.id+'" type="text" inputmode="numeric" placeholder="0" value="'+(b.amount||'')+'">'
          + '<button class="del'+(armed==='b'+b.id?' armed':'')+'" data-bdel="'+b.id+'">'+(armed==='b'+b.id?'確定':'刪除')+'</button></div>';
      if (b === c.budgets[0]) h += '<div class="itip up" id="inTipBud"'+(noBud?'':' hidden')+'>尚未填寫預期支出！<br>在上面填入金額</div>';
    });
    if (!c.budgets.length) h += '<div class="itip down" id="inTipBud"'+(noBud?'':' hidden')+'>尚未填寫預期支出！按下面新增一筆</div>';
    h += '<button class="btn ghost" id="sAdd" style="width:100%;margin-top:4px">＋ 新增一筆預期支出</button><div class="hint">項目和金額會帶到下一期；金額為 0 的不顯示。</div></div>';
    h += '<h3>'+periodName(c)+'預期支出分配狀況</h3><div class="card" id="allocBox">'+allocHTML(c)+'</div>';
    h += '<h3>其他</h3><div class="card">'
      + '<button class="btn danger'+(armed==='reset'?' armed':'')+'" id="sReset" style="width:100%">'+(armed==='reset'?'再按一次確定清除':'清除所有資料，重新開始')+'</button>'
      + '<div class="hint">會刪除這支手機上的所有紀錄，無法復原。</div></div>';
    return h;
  }

  function render(){
    rollover();
    viewIdx = S.cycles.length-1;
    if (tab === 'settings') viewIdx = S.cycles.length-1;
    renderHeader();
    updateTip();
    const v = document.getElementById('view');
    v.innerHTML = tab === 'budget' ? renderBudget() : tab === 'history' ? renderHistory() : renderSettings();
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    if (tab !== 'budget') detailId = null;
    renderDetail();
    renderHistDetail();
    fitText();
  }

  // ---------- 事件 ----------
  document.querySelector('.tabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    tab = b.dataset.tab; armed = null; render(); window.scrollTo(0,0);
  });
  document.getElementById('prevC').onclick = () => { if (viewIdx>0){ viewIdx--; armed=null; render(); } };
  document.getElementById('nextC').onclick = () => { if (!isCurrent()){ viewIdx++; armed=null; render(); } };

  document.getElementById('view').addEventListener('click', e => {
    const del = e.target.closest('[data-del]');
    if (del){
      e.stopPropagation();
      const id = del.dataset.del;
      if (armed === id){ const c = curCycle(); c.expenses = c.expenses.filter(x => x.id !== id); armed = null; save(); toast('已刪除'); }
      else armed = id;
      render(); return;
    }
    const bdel = e.target.closest('[data-bdel]');
    if (bdel){
      const id = bdel.dataset.bdel, c = curCycle();
      if (c.expenses.some(x => x.budgetId === id)){ toast('已有花費紀錄，無法刪除'); return; }
      if (armed === 'b'+id){ c.budgets = c.budgets.filter(b => b.id !== id); armed = null; save(); toast('已刪除'); }
      else armed = 'b'+id;
      render(); return;
    }
    const idel = e.target.closest('[data-idel]');
    if (idel){
      const id = idel.dataset.idel, c = curCycle();
      if (armed === 'i'+id){ c.incomes = c.incomes.filter(x => x.id !== id); armed = null; save(); toast('已刪除收入'); }
      else armed = 'i'+id;
      render(); return;
    }
    if (e.target.id === 'sCarryReset'){ e.preventDefault(); const c = curCycle(); c.carry = c.carryAuto; save(); render(); toast('已恢復自動金額'); return; }
    if (e.target.id === 'sAddInc'){
      curCycle().incomes.push({ id: uid(), name: '新收入', amount: 0 }); save(); render();
      const ins = document.querySelectorAll('[data-inm]'); const last = ins[ins.length-1]; last && last.select(); return;
    }
    if (e.target.id === 'sAdd'){
      curCycle().budgets.push({ id: uid(), name: '新項目', amount: 0 }); S.firstRun = false; save(); render();
      const ins = document.querySelectorAll('[data-nm]'); const last = ins[ins.length-1]; last && last.select(); return;
    }
    if (e.target.id === 'sFakeGo'){
      const v = document.getElementById('sFake').value;
      if (!v) return;
      if (v < curCycle().start){ toast('只能往後調'); return; }
      S.fakeToday = v === realToday() ? null : v; save();
      const before = S.cycles.length; render();
      toast(S.cycles.length > before ? '已進入新的一期' : '已套用');
      return;
    }
    if (e.target.id === 'sFakeOff'){
      if (realToday() < curCycle().start){ toast('請先清除資料'); return; }
      S.fakeToday = null; save(); render(); toast('已回到真實日期'); return;
    }
    if (e.target.id === 'sReset'){
      if (armed === 'reset'){ try{ localStorage.removeItem(KEY); }catch(_){} memCopy = null; location.reload(); return; }
      armed = 'reset'; render(); return;
    }
    const card = e.target.closest('[data-card]');
    const hc = e.target.closest('[data-hist]');
    if (hc){ histIdx = Number(hc.dataset.hist); renderHistDetail(); return; }
    if (card){ detailId = card.dataset.card; armed = null; renderDetail(); return; }
    if (e.target.closest('[data-inc]')){ incomeOpen = !incomeOpen; render(); }
  });

  document.getElementById('view').addEventListener('change', e => {
    const t = e.target, c = curCycle();
    if (t.id === 'sPay'){
      S.payday = Number(t.value);
      c.end = nextPaydayAfter(today() < c.start ? c.start : today(), S.payday);
      S.firstRun = false; save(); render(); toast('發薪日已改為每月 '+S.payday+' 號'); return;
    }
    if (t.dataset.nm){ const b = c.budgets.find(x => x.id === t.dataset.nm); const v = t.value.trim(); if (b && v){ b.name = v; S.firstRun=false; save(); } else render(); return; }
    if (t.id === 'sName'){ const v = t.value.trim(); if (v){ S.userName = v; save(); renderHeader(); } else t.value = S.userName || ''; return; }
    if (t.id === 'sCarry'){ c.carry = Math.round(toNum(t.value)); t.value = c.carry || ''; save(); liveAlloc(); return; }
    if (t.dataset.inm){ const x = c.incomes.find(i => i.id === t.dataset.inm); const v = t.value.trim(); if (x && v){ x.name = v; save(); } else render(); return; }
    if (t.dataset.iam){ const x = c.incomes.find(i => i.id === t.dataset.iam); if (x){ x.amount = Math.max(0, Math.round(toNum(t.value))); t.value = x.amount || ''; save(); liveAlloc(); } return; }
    if (t.dataset.am){ const b = c.budgets.find(x => x.id === t.dataset.am); const v = Math.max(0, Math.round(toNum(t.value))); t.value = v || ''; if (b){ b.amount = v; S.firstRun=false; save(); liveAlloc(); } return; }
  });

  document.getElementById('view').addEventListener('input', e => { if (e.target.dataset.iam || e.target.dataset.am || e.target.id === 'sCarry') liveAlloc(); });

  document.getElementById('hdetail').addEventListener('click', e => {
    if (e.target.id === 'hdetail' || e.target.closest('#hClose')){ histIdx = null; renderHistDetail(); }
  });
  document.getElementById('detail').addEventListener('click', e => {
    if (e.target.id === 'detail' || e.target.closest('#dClose')){ closeDetail(); return; }
    const del = e.target.closest('[data-del]');
    if (del){
      const id = del.dataset.del;
      if (armed === id){ const c = curCycle(); c.expenses = c.expenses.filter(x => x.id !== id); armed = null; save(); toast('已刪除'); render(); }
      else { armed = id; renderDetail(); }
    }
  });

  // ---------- 首次開啟：輸入名字 ----------
  function showWelcome(){
    if (S.userName) return;
    document.getElementById('welcome').classList.remove('hidden');
    setTimeout(() => document.getElementById('wName').focus(), 200);
  }
  document.getElementById('wForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = document.getElementById('wName').value.trim();
    if (!v){ toast('請輸入名字或暱稱'); return; }
    S.userName = v; save();
    document.getElementById('welcome').classList.add('hidden');
    render(); toast('嗨，' + v + '！');
  });

  // ---------- 記一筆 ----------
  const mask = document.getElementById('mask');
  let pick = null;
  function openSheet(pre){
    pre = (pre && pre.type !== 'click') ? pre : null;
    const c = curCycle();
    const choices = shown(c);
    if (!choices.length){ toast('請先到設定填金額'); return; }
    if (pre && pre.budgetId && choices.some(b => b.id === pre.budgetId)) pick = pre.budgetId;
    if (!pick || !choices.some(b => b.id === pick)) pick = choices[0].id;
    document.getElementById('fChips').innerHTML = choices.map(b => {
      const r = b.amount - spentOf(c, b.id);
      return '<button type="button" class="chip'+(b.id===pick?' on':'')+'" data-pick="'+b.id+'">'+esc(b.name)+'<small>剩'+money(r)+'</small></button>';
    }).join('');
    const d = document.getElementById('fDate');
    d.min = c.start; d.max = addDays(c.end, -1); d.value = today();
    document.getElementById('fAmt').value = pre && pre.amount ? pre.amount : '';
    document.getElementById('fNote').value = pre && pre.note ? pre.note : '';
    const vh = document.getElementById('fVoice');
    if (pre){ vh.hidden = false; vh.innerHTML = '語音：「'+esc(pre.text)+'」' + (pre.amount && pre.budgetId ? '<br>請確認內容後按儲存' : '<br><b>'+(!pre.amount?'沒聽出金額':'沒認出項目')+'，請手動補上</b>'); }
    else { vh.hidden = false; vh.innerHTML = '小技巧：長按＋可以用語音記帳，說「金額 項目 備註」'; }
    mask.classList.remove('hidden');
    if (!pre) setTimeout(() => document.getElementById('fAmt').focus(), 50);
  }

  // ---------- 語音記帳：長按＋開始聽，放開結束 ----------
  // 說法：「金額 項目 備註」，例如「120 餐飲 午餐便當」
  const CN = {'零':0,'〇':0,'一':1,'二':2,'兩':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  function cnToNum(t){                      // 支援「一百二十」「兩千五」「一萬三千五」「三百五」
    let total = 0, section = 0, num = 0, lastUnit = 0;
    for (const ch of t){
      if (ch in CN){ num = CN[ch]; if (ch === '零' || ch === '〇') lastUnit = 0; }   // 有「零」就照字面算，例如一百零五
      else if (ch === '十' || ch === '百' || ch === '千'){
        const u = ch === '十' ? 10 : ch === '百' ? 100 : 1000;
        section += (num || (ch === '十' ? 1 : 0)) * u; num = 0; lastUnit = u;
      } else if (ch === '萬'){
        total += (section + num) * 10000; section = 0; num = 0; lastUnit = 10000;
      }
    }
    if (num && lastUnit >= 100) num = num * lastUnit / 10;   // 口語省略：「一百二」= 120
    return total + section + num;
  }
  const KEYWORDS = {
    '餐飲':['吃','餐','飯','麵','便當','飲料','咖啡','早餐','午餐','晚餐','宵夜','點心','零食','外送'],
    '交通':['捷運','公車','加油','油錢','停車','高鐵','火車','計程車','車資','悠遊卡'],
    '娛樂':['電影','遊戲','唱歌','KTV','旅遊','門票','串流'],
    '寵物用品':['寵物','貓','狗','飼料','貓砂','罐頭'],
    '機車':['機車','保養','維修','輪胎'],
    '房租':['房租','租金'],
    '貸款':['貸款','還款'],
    '儲蓄':['儲蓄','存錢','存款'],
    '投資':['投資','股票','基金','定期定額'],
    '生活用品':['日用','衛生紙','洗衣','全聯','家樂福','超市']
  };
  function parseVoice(text){
    const c = curCycle(), choices = shown(c);
    let t = text.replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)).trim();
    let amount = 0;
    const m = t.match(/(\d[\d,]*(?:\.\d+)?)\s*萬?|[零〇一二兩三四五六七八九十百千萬]+/);
    if (m){
      if (m[1]) amount = parseFloat(m[1].replace(/,/g,'')) * (m[0].includes('萬') ? 10000 : 1);
      else amount = cnToNum(m[0]);
      t = (t.slice(0, m.index) + ' ' + t.slice(m.index + m[0].length));
    }
    t = t.replace(/^\s*(元|塊錢|塊|塊錢的)/, ' ').replace(/(新台幣|台幣|NT\$?|\$)/gi, ' ');
    // 項目：先找名稱（越長越優先），找不到再用常見詞對照
    let budget = null, hit = '';
    choices.slice().sort((a,b) => b.name.length - a.name.length).forEach(b => { if (!budget && t.includes(b.name)){ budget = b; hit = b.name; } });
    if (!budget){
      for (const b of choices){
        const kws = KEYWORDS[b.name] || [];
        const k = kws.find(k => t.toLowerCase().includes(k.toLowerCase()));
        if (k){ budget = b; break; }
      }
    }
    let note = (hit ? t.replace(hit, ' ') : t).replace(/[，。,\.、]/g, ' ').replace(/\s+/g, ' ').trim();
    return { text, amount: amount ? Math.round(amount*100)/100 : 0, budgetId: budget ? budget.id : null, note };
  }

  const fab = document.getElementById('fab');
  const vo = document.getElementById('voiceOverlay'), voText = document.getElementById('voiceText');
  let holdTimer = null, voiceOn = false, suppressClick = false, webRec = null, lastPartial = '';
  function voiceUI(state, txt){
    if (state === 'hide'){ vo.classList.add('hidden'); document.body.classList.remove('listening'); fab.classList.remove('jelly'); return; }
    vo.classList.remove('hidden'); vo.dataset.state = state; document.body.classList.add('listening');
    document.getElementById('voiceTitle').textContent = state === 'listening' ? '聆聽中…放開結束' : '辨識中…';
    voText.textContent = txt || (window.AndroidVoice ? '請說「金額 項目 備註」\n例如：120 餐飲 午餐便當'
                                                     : '請說「金額 項目 備註」\n例如：120 餐飲 午餐便當\n\n（預覽版無法收音，放開後可打字模擬）');
  }
  function voiceResult(text){
    // 有些手機放開後的「最終結果」是空的，就用最後看到的即時文字
    text = (text || '').trim() || lastPartial.trim();
    lastPartial = '';
    voiceUI('hide');
    if (!text){ toast('沒有聽到內容，請再試一次'); return; }
    openSheet(parseVoice(text));
  }
  // App 外殼（Android）呼叫這個函式回報辨識狀態
  window.onVoiceEvent = function(type, text){
    if (type === 'partial'){ if (text) lastPartial = text; voiceUI(voiceOn ? 'listening' : 'working', text); }
    else if (type === 'result') voiceResult(text);
    else if (type === 'error'){
      voiceOn = false;
      if (lastPartial.trim()) voiceResult('');          // 已經聽到字了，就用聽到的字，不當成失敗
      else { voiceUI('hide'); toast(text || '語音辨識失敗'); }
    }
  };
  function typeFallback(){
    voiceOn = false; voiceUI('hide');
    const box = document.getElementById('voiceType');
    box.classList.remove('hidden');
    const inp = document.getElementById('vtIn'); inp.value = ''; setTimeout(() => inp.focus(), 50);
  }
  document.getElementById('vtForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = document.getElementById('vtIn').value.trim();
    document.getElementById('voiceType').classList.add('hidden');
    if (v) openSheet(parseVoice(v));
  });
  document.getElementById('vtCancel').onclick = () => document.getElementById('voiceType').classList.add('hidden');
  function startVoice(){
    if (!shown(curCycle()).length){ toast('請先到設定填金額'); return; }
    voiceOn = true; suppressClick = true; lastPartial = '';
    try{ navigator.vibrate && navigator.vibrate(30); }catch(_){}
    voiceUI('listening');
    fab.classList.add('jelly');
    if (window.AndroidVoice) window.AndroidVoice.start();
  }
  function stopVoice(){
    if (!voiceOn) return;
    voiceOn = false;
    if (window.AndroidVoice){ voiceUI('working', lastPartial || ''); window.AndroidVoice.stop(); }
    else typeFallback();
  }
  fab.addEventListener('pointerdown', e => { try{ fab.setPointerCapture(e.pointerId); }catch(_){} suppressClick = false; fab.classList.remove('bounce'); fab.classList.add('squish'); clearTimeout(holdTimer); holdTimer = setTimeout(() => { fab.classList.remove('squish'); startVoice(); }, 450); });
  ['pointerup','pointercancel','pointerleave'].forEach(ev => fab.addEventListener(ev, () => {
    clearTimeout(holdTimer);
    if (fab.classList.contains('squish') || fab.classList.contains('jelly')){
      fab.classList.remove('squish','jelly'); void fab.offsetWidth; fab.classList.add('bounce');
    }
    stopVoice();
  }));
  fab.addEventListener('animationend', e => { if (e.animationName === 'jellyOut') fab.classList.remove('bounce'); });
  fab.addEventListener('contextmenu', e => e.preventDefault());
  fab.addEventListener('click', e => { if (suppressClick){ suppressClick = false; return; } openSheet(); });
  window.__voiceTest = t => openSheet(parseVoice(t));   // 測試用
  document.getElementById('fCancel').onclick = () => mask.classList.add('hidden');
  mask.addEventListener('click', e => { if (e.target === mask) mask.classList.add('hidden'); });
  document.getElementById('fChips').addEventListener('click', e => {
    const b = e.target.closest('[data-pick]'); if (!b) return;
    pick = b.dataset.pick;
    document.querySelectorAll('[data-pick]').forEach(x => x.classList.toggle('on', x.dataset.pick === pick));
  });
  document.getElementById('sheet').addEventListener('submit', e => {
    e.preventDefault();
    const c = curCycle();
    const amt = toNum(document.getElementById('fAmt').value);
    const date = document.getElementById('fDate').value;
    if (!(amt > 0)){ toast('請輸入金額'); return; }
    if (!date || date < c.start || date >= c.end){ toast('日期需在 '+md(c.start)+'－'+md(addDays(c.end,-1))); return; }
    c.expenses.push({ id: uid(), ts: Date.now(), date, amount: Math.round(amt*100)/100, budgetId: pick, note: document.getElementById('fNote').value.trim() });
    S.firstRun = false; save();
    mask.classList.add('hidden'); render();
    const b = c.budgets.find(x => x.id === pick);
    toast('已記到「'+b.name+'」');
  });

  render();
  showWelcome();
})();
</script>
</body>
