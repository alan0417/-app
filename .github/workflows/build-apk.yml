# 每次上傳程式碼，GitHub 就自動打包一次 apk。
# 推送 v 開頭的版本標籤（例如 v1.0.0）時，會另外發布到 Releases 頁面供人下載。
name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 準備簽章金鑰
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # 金鑰以加密檔放在 keystore/release.jks.enc，只有知道密碼（GitHub Secret）才能解開
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in keystore/release.jks.enc \
              -out "$RUNNER_TEMP/release.jks" -pass env:KEYSTORE_PASSWORD
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::還沒設定 KEYSTORE_PASSWORD，這次用測試金鑰簽章（之後無法直接覆蓋更新）"
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: 打包 apk
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: paydaybudget
        run: |
          set +e
          gradle assembleRelease --no-daemon --console=plain > build.log 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            # 把錯誤重點寫成註記，方便在建置摘要直接看到
            msg=$(grep -A 25 -E "What went wrong|error:|e: |FAILURE" build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${msg}"
            tail -80 build.log
            exit 1
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/payday-budget-${VERSION_NAME}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: payday-budget-apk
          path: dist/*.apk

      - name: 發布到 Releases（只有版本標籤才會）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: 發薪日預算 ${{ env.VERSION_NAME }}
          body: |
            下載下面的 apk 檔，在 Android 手機上開啟安裝。
            第一次安裝時，手機會詢問是否允許「安裝不明來源的應用程式」，請選允許。
