# 每次上傳程式碼，GitHub 就自動打包一次 apk。
# version.txt 裡的版本號還沒發布過時，會自動發布到 Releases 頁面供人下載。
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 準備簽章金鑰
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # 金鑰以加密檔放在 keystore/release.jks.enc，只有知道密碼（GitHub Secret）才能解開
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in keystore/release.jks.enc \
              -out "$RUNNER_TEMP/release.jks" -pass env:KEYSTORE_PASSWORD
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::還沒設定 KEYSTORE_PASSWORD，這次用測試金鑰簽章（之後無法直接覆蓋更新）"
          fi
          # 版本號寫在 version.txt；這個版本還沒發布過，打包完就自動發布到 Releases
          VERSION_NAME=$(tr -d ' \r\n' < version.txt)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          if [ -n "$KEYSTORE_PASSWORD" ] && ! gh release view "v$VERSION_NAME" >/dev/null 2>&1; then
            echo "DO_RELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: 打包 apk
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: paydaybudget
        run: |
          set +e
          gradle assembleRelease bundleRelease --no-daemon --console=plain > build.log 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            # 把錯誤重點寫成註記，方便在建置摘要直接看到
            msg=$(grep -A 25 -E "What went wrong|error:|e: |FAILURE" build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${msg}"
            tail -80 build.log
            exit 1
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/payday-budget-${VERSION_NAME}.apk"
          # Google Play 上架用的 .aab
          cp app/build/outputs/bundle/release/app-release.aab "dist/payday-budget-${VERSION_NAME}.aab"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: payday-budget
          path: dist/*

      - name: 發布到 Releases（新版本號才會）
        if: env.DO_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.apk
            dist/*.aab
          name: 發薪日預算 ${{ env.VERSION_NAME }}
          body: |
            下載下面的 apk 檔，在 Android 手機上開啟安裝。（.aab 檔是上架 Google Play 用的，手機不能直接安裝）
            第一次安裝時，手機會詢問是否允許「安裝不明來源的應用程式」，請選允許。
